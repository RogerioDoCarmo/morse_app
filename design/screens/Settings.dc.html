<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #12a594; text-decoration: none; }
    a:hover { color: #0d7d70; }
    button { font: inherit; border: 0; background: none; cursor: pointer; text-align: left; }
    input[type="range"] { accent-color: #12a594; width: 100%; height: 26px; }
  </style>
</helmet>
<div style="width: 390px; height: 1080px; background: #f5f6f8; color: #101820; font-family: 'Plus Jakarta Sans', 'Avenir Next', sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 54px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; gap: 4px; padding: 0 20px; height: 48px; flex-shrink: 0;">
    <button style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #101820; margin-left: -12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.025em;">Settings</div>
  </div>

  <div style="padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 22px;">

    <div>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: #9aa3ad; padding: 0 4px 8px;">TAP INPUT</div>
      <div style="background: #ffffff; border-radius: 22px; padding: 18px; box-shadow: 0 1px 2px rgba(16, 24, 32, 0.04), 0 10px 26px rgba(16, 24, 32, 0.05);">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px;">
          <span style="font-size: 15px; font-weight: 700;">Dot / dash cut-off</span>
          <span style="font-family: 'DM Mono', 'Courier New', monospace; font-size: 15px; font-weight: 500; color: #12a594;">{{ unit }} ms</span>
        </div>
        <div style="font-size: 13px; font-weight: 500; color: #6a7480; line-height: 1.45; margin-bottom: 10px;">Hold the key longer than this and it counts as a dash. “Long” depends on your speed, so set it to suit you.</div>
        <input type="range" min="80" max="400" step="10" value="{{ unit }}" onChange="{{ setUnit }}">
        <div style="display: flex; justify-content: space-between; font-family: 'DM Mono', 'Courier New', monospace; font-size: 11px; color: #9aa3ad; margin-top: -2px;">
          <span>80</span>
          <span>400</span>
        </div>
        <button style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 46px; margin-top: 14px; background: #e7f6f3; color: #0d7d70; border-radius: 14px; font-size: 14px; font-weight: 700;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.5"></circle><path d="M7.05 16.95a7 7 0 0 1 0-9.9"></path><path d="M16.95 7.05a7 7 0 0 1 0 9.9"></path></svg>
          Calibrate by tapping
        </button>
      </div>
    </div>

    <div>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: #9aa3ad; padding: 0 4px 8px;">LANGUAGE</div>
      <div style="background: #ffffff; border-radius: 22px; box-shadow: 0 1px 2px rgba(16, 24, 32, 0.04), 0 10px 26px rgba(16, 24, 32, 0.05); overflow: hidden;">
        <button style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 58px; padding: 12px 18px;">
          <span style="font-size: 15px; font-weight: 600;">App language</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; color: #6a7480;">
            English
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3bac2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>
        <div style="height: 1px; background: #eef0f3; margin-left: 18px;"></div>
        <button style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 58px; padding: 12px 18px;">
          <span style="font-size: 15px; font-weight: 600;">Speech recognition</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; color: #6a7480;">
            English (US)
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3bac2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>
      </div>
    </div>

    <div>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: #9aa3ad; padding: 0 4px 8px;">OUTPUT</div>
      <div style="background: #ffffff; border-radius: 22px; box-shadow: 0 1px 2px rgba(16, 24, 32, 0.04), 0 10px 26px rgba(16, 24, 32, 0.05); overflow: hidden;">
        <div style="padding: 14px 18px 16px;">
          <div style="font-size: 15px; font-weight: 600; margin-bottom: 10px;">Playback speed</div>
          <div style="display: flex; gap: 4px; background: #eef0f3; border-radius: 14px; padding: 4px;">
            <sc-for list="{{ speeds }}" as="s" hint-placeholder-count="3">
              <sc-if value="{{ s.on }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ s.pick }}" style="flex-grow: 1; height: 44px; border-radius: 10px; background: #ffffff; color: #101820; font-size: 14px; font-weight: 700; text-align: center; box-shadow: 0 1px 2px rgba(16, 24, 32, 0.05), 0 3px 8px rgba(16, 24, 32, 0.06);">{{ s.label }}</button>
              </sc-if>
              <sc-if value="{{ s.off }}" hint-placeholder-val="{{ true }}">
                <button onClick="{{ s.pick }}" style="flex-grow: 1; height: 44px; border-radius: 10px; background: transparent; color: #6a7480; font-size: 14px; font-weight: 600; text-align: center;">{{ s.label }}</button>
              </sc-if>
            </sc-for>
          </div>
        </div>
        <div style="height: 1px; background: #eef0f3; margin-left: 18px;"></div>
        <sc-for list="{{ toggles }}" as="row" hint-placeholder-count="2">
          <button onClick="{{ row.flip }}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 62px; padding: 12px 18px; border-top: 1px solid #eef0f3;">
            <span>
              <span style="display: block; font-size: 15px; font-weight: 600;">{{ row.label }}</span>
              <span style="display: block; font-size: 13px; font-weight: 500; color: #6a7480; margin-top: 2px;">{{ row.hint }}</span>
            </span>
            <sc-if value="{{ row.on }}" hint-placeholder-val="{{ true }}">
              <span style="flex-shrink: 0; width: 50px; height: 30px; border-radius: 999px; background: #12a594; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box;">
                <span style="width: 24px; height: 24px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(16, 24, 32, 0.25);"></span>
              </span>
            </sc-if>
            <sc-if value="{{ row.off }}" hint-placeholder-val="{{ false }}">
              <span style="flex-shrink: 0; width: 50px; height: 30px; border-radius: 999px; background: #d8dde3; display: flex; align-items: center; justify-content: flex-start; padding: 3px; box-sizing: border-box;">
                <span style="width: 24px; height: 24px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(16, 24, 32, 0.25);"></span>
              </span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>

    <div>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: #9aa3ad; padding: 0 4px 8px;">ABOUT</div>
      <div style="background: #ffffff; border-radius: 22px; box-shadow: 0 1px 2px rgba(16, 24, 32, 0.04), 0 10px 26px rgba(16, 24, 32, 0.05); overflow: hidden;">
        <button style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 58px; padding: 12px 18px;">
          <span style="font-size: 15px; font-weight: 600;">What is Morse code?</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3bac2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <div style="height: 1px; background: #eef0f3; margin-left: 18px;"></div>
        <button style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 58px; padding: 12px 18px;">
          <span style="font-size: 15px; font-weight: 600;">Privacy</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #6a7480;">
            Nothing leaves the device
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3bac2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>
        <div style="height: 1px; background: #eef0f3; margin-left: 18px;"></div>
        <button style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 58px; padding: 12px 18px;">
          <span style="font-size: 15px; font-weight: 600;">Open-source licences</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b3bac2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unit: 180, wpm: 10, tone: true, tts: true };
  }

  renderVals() {
    const wpm = this.state.wpm;
    return {
      unit: this.state.unit,
      setUnit: (e) => this.setState({ unit: Number(e.target.value) }),
      speeds: [5, 10, 15].map((v) => ({
        label: v + ' WPM',
        on: wpm === v,
        off: wpm !== v,
        pick: () => this.setState({ wpm: v }),
      })),
      toggles: [
        {
          label: 'Play a tone with the flash',
          hint: 'Audible beeps alongside the torch',
          on: this.state.tone,
          off: !this.state.tone,
          flip: () => this.setState({ tone: !this.state.tone }),
        },
        {
          label: 'Read decoded text aloud',
          hint: 'Uses the app language voice',
          on: this.state.tts,
          off: !this.state.tts,
          flip: () => this.setState({ tts: !this.state.tts }),
        },
      ],
    };
  }
}
</script>
</body>
</html>
