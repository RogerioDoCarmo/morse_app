Builds:
  - versionName: 0.3.7
    versionCode: 307
    commit: 52a6b5dfb6148b97a1f5c026fb40c8a5751d51d9
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm cmake ninja-build
      - npm install -g pnpm@10.4.1
    init:
      - cd ../..
      - pnpm install --frozen-lockfile --prod
      - patch -p1 -d node_modules/expo-camera/android < patches/expo-camera-remove-google-mlkit.patch
      - patch -p1 -d node_modules/expo-application/android < patches/expo-application-remove-installreferrer.patch
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i '/jvmTarget\|JavaVersion/s/17/21/' node_modules/react-native-worklets/android/build.gradle.kts
      - sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/'
        android/gradle.properties
      - sed -i 's/^expo.useLegacyPackaging=.*/expo.useLegacyPackaging=true/' android/gradle.properties
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
    scandelete:
      - node_modules
    ndk: 27.1.12297006

