# Store screenshots, captured from the running app.
#
# ⚠️ NOT in `flows/`, deliberately. `pnpm test:e2e` runs that whole directory
# on every PR, and this flow asserts nothing — it would add minutes to every
# run to produce images nobody looked at. Run it when screenshots are wanted:
#
#     pnpm screenshots
#
# ⚠️ THE NAMES ARE LETTERED, NOT NUMBERED, and that is not cosmetic. Play
# Console orders a multi-file upload by the browser's own file ordering, which
# did NOT follow `00-`, `01-`, `02-` — the images arrived shuffled and had to be
# dragged back into place by hand, guessing which was which. Letters survive
# that ordering. Renamed on 20 September, after it happened.
#
# ⚠️ The point of capturing rather than mocking: a store screenshot has to show
# the app as it actually is. The previous mockups were rendered from the design
# canvas and drifted — they showed "Hello world" where the app seeds SOS, a
# "Flash it" button where it says "Signal", and no output-channel strip at all,
# which is the app's main control.
appId: com.rogeriodocarmo.morse
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - assertVisible:
          id: 'first-run'

# The welcome carousel is worth a shot of its own: it is the first thing a new
# user sees, and it explains the output channels the store copy talks about.
- takeScreenshot: a-welcome

- tapOn:
    id: 'first-run-skip'
- assertNotVisible:
    id: 'first-run'
# ⚠️ No `hideKeyboard`. The Translator no longer focuses its input on open, so
# there is no keyboard covering this shot — and a dismiss with nothing to
# dismiss goes looking for somewhere to tap, which cost this flow a run once.

- assertVisible:
    id: 'translator-screen'

# ⚠️ WAIT FOR THE HINT DOT TO STOP BREATHING.
#
# The field is untouched here, so the dot beside the label is pulsing: its halo
# sweeps from 0.45 opacity to 0 every 1.1 seconds. Shooting into that catches a
# different-sized ring every run, which is nondeterminism in an asset that gets
# compared across seven images and two platforms — and reads as a rendering
# artefact to anyone who does not know what it is.
#
# `waitForAnimationToEnd` is the right primitive ONLY because the pulse is
# finite. It ran forever until 0.3.4, and this would have waited out its whole
# timeout instead of returning when the dot came to rest.
#
# ⚠️ TWO animations now, not one: the first letter chip also wears a ring that
# breathes four times before coming to rest. Both are finite and both are
# covered by this one wait — the chip's is the shorter of the two.
#
# ⚠️ AND THE RING IS STILL THERE IN THE SHOT, at rest. That is deliberate, not
# a leftover frame: it says the chips are pressable, which is the one thing
# about this screen a tester used a whole release without discovering. It
# disappears for good the first time any chip is pressed, so it is only ever
# in a shot taken on a freshly cleared device — which is every shot here.
- waitForAnimationToEnd:
    timeout: 12000

# The channel strip switched on, which is the feature the listing leads with.
# Screen and Vibrate only: Light raises the camera permission, and a system
# dialog in a store screenshot is a rejection waiting to happen.
#
# ⚠️ A SHOT WAS TAKEN HERE AND HAS BEEN DROPPED. It was this same screen with
# the strip still off, and on a store listing the two were indistinguishable —
# pixel-identical except for three toggles changing colour — so the pair spent
# two of eight slots saying one thing. The wait above still earns its keep: it
# is what stops the pulsing hint being caught mid-sweep in THIS shot.
- tapOn:
    id: 'channel-screen'
- tapOn:
    id: 'channel-buzz'
- takeScreenshot: b-translator

- tapOn:
    id: 'tab-speak'
- assertVisible:
    id: 'speech-screen'
- takeScreenshot: c-speech

- tapOn:
    id: 'tab-tap'
- assertVisible:
    id: 'tap-screen'
- takeScreenshot: d-tap-decode

- tapOn:
    id: 'tab-learn'
- assertVisible:
    id: 'learn-screen'
- takeScreenshot: e-learn

- tapOn:
    id: 'tab-translate'
# ⚠️ No `hideKeyboard` here, and its absence is load-bearing. The Translator
# autofocuses on OPEN only — coming back to the tab does not raise a keyboard —
# so a dismiss with nothing to dismiss went looking for somewhere to tap and
# took the app with it: `open-settings` was gone by the time the next step
# looked for it, having found the gear on a screen that was no longer there.
- tapOn:
    id: 'open-settings'
- assertVisible:
    id: 'settings-screen'
- takeScreenshot: f-settings
