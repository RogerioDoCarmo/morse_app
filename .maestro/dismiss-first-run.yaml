# The first-run guide appears on every clearState launch, because clearing
# state is exactly what makes a device look brand new. Flows that are not
# about the guide walk past it here rather than each repeating the steps.
#
# ⚠️ ONE tap. Skip used to jump to the last slide, so this needed a second tap
# on Start; it now leaves outright. If it ever takes two taps again, every
# flow in the suite starts on the wrong screen.
appId: com.rogeriodocarmo.morse
---
- assertVisible:
    id: 'first-run'
- tapOn:
    id: 'first-run-skip'
- assertNotVisible:
    id: 'first-run'
# ⚠️ There is NO `hideKeyboard` here any more, and its absence is load-bearing.
#
# There used to be one, because the Translator focused its input on open and
# the keyboard covered the tab bar every flow reaches for next. The input no
# longer takes focus, so there is no keyboard — and a dismiss with nothing to
# dismiss is not harmless: it goes looking for somewhere to tap and takes the
# app with it. `screenshots.yaml` lost a whole run to exactly that.
