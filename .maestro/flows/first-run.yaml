# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
# ⚠️ Wrapped in a retry because the EMULATOR loses this, not the app — see the
# note in translator.yaml. `clearState` force-stops and relaunches, and the
# kill races the launch.
#
# The retry has to carry an assertion of its own: `launchApp` succeeds even
# when the process is killed a moment later, so the launch alone would not
# notice.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      # It exists because Light starts off: without it the torch is a feature
      # nobody finds and the output strip looks like decoration.
      - assertVisible:
          id: 'first-run'
- assertVisible:
    id: 'first-run-art-chips'
- assertVisible:
    id: 'first-run-dots'

- tapOn:
    id: 'first-run-next'
- assertVisible:
    id: 'first-run-art-channels'
# The middle slide is the one that had to exist: the real strip, light off.
- assertVisible:
    id: 'channel-light'

- tapOn:
    id: 'first-run-next'
- assertVisible:
    id: 'first-run-art-letter'
# ⚠️ AND THE CHIPS ON IT ARE LIVE. This slide has said "tap any letter to hear
# just that one" since the guide existed, above a chip drawn with the
# highlight already on it — and a tester finished 0.3.4 not knowing the chips
# do anything. So one of them points at itself until it is pressed, and
# pressing it plays that letter here, in the guide.
#
# ⚠️ `chip-progress-ring`, NOT `tap-halo`. The guide wears the travelling ring,
# which turns twenty times; the app's own chips wear the halo, which breathes
# four — see `audio-playback.yaml`, which asserts `tap-halo` on the Translator
# and is correct to. Four beats is what the tester missed, so this slide got the
# louder one; using it everywhere would be a nag on every message typed.
- assertVisible:
    id: 'chip-progress-ring'
# Index 0 is the FIRST chip, while the ring sits on the middle one — pressing
# any chip spends the hint, and pressing one the ring is not on proves it.
- tapOn:
    id: 'morse-letter'
    index: 0
- assertNotVisible:
    id: 'chip-progress-ring'

# ⚠️ The fourth slide DEMONSTRATES rather than describes, and it is the only
# one that does. A tester came back from 0.3.4 confused by the flashing circle
# — and by the letter chips, which are explained twice in words: on slide three
# above and again in the Morse card's own header. Both were on screen and both
# were missed, so this one shows the surface actually running.
- tapOn:
    id: 'first-run-next'
- assertVisible:
    id: 'first-run-art-surface'
- assertVisible:
    id: 'first-run-surface-surface'
# Skip is gone on the last slide: there is nothing left to skip, and Start
# already says the same thing.
- assertNotVisible:
    id: 'first-run-skip'

# It swipes as well as it taps. The four slides are mounted side by side in a
# paging scroll view, which is the whole of the gesture — so what this proves
# is that the DOTS and the BUTTON follow it, rather than the pager and the
# index drifting apart. Back to the middle slide, then on again.
#
# ⚠️ Percentages, not `from: <element>`. An element swipe travels a fraction of
# that element, and a paging scroll view snaps BACK unless the drag passes half
# a page or carries real velocity: the first version of this swiped from the
# illustration, moved nothing, and failed against a screenshot of the slide it
# had never left. This one crosses three quarters of the screen.
#
# 45% height keeps it inside the pager on every slide — below the Skip row,
# above the dots and the button.
- swipe:
    start: 12%, 45%
    end: 88%, 45%
- assertVisible:
    id: 'first-run-skip'
- swipe:
    start: 88%, 45%
    end: 12%, 45%
- assertNotVisible:
    id: 'first-run-skip'

- tapOn:
    id: 'first-run-next'
- assertNotVisible:
    id: 'first-run'
- assertVisible:
    id: 'translator-screen'

# And it stays gone: the version it was shown for has been stored.
- launchApp:
    clearState: false
- assertVisible:
    id: 'translator-screen'
- assertNotVisible:
    id: 'first-run'

# Skip is the other way out, and it goes all the way out. It used to jump to
# the last slide, which meant "skip this" was answered with one more slide and
# one more button.
- launchApp:
    clearState: true
# ⚠️ EXTENDED, not a bare assertion. A cold launch after `clearState` shows the
# splash first, and this one had neither the retry the launch at the top of
# this flow carries nor any wait of its own: it asserted against the splash and
# failed with the carousel about half a second away. Its own screenshot is the
# logo on an empty screen.
- extendedWaitUntil:
    visible:
      id: 'first-run'
    timeout: 20000
- tapOn:
    id: 'first-run-skip'
- assertNotVisible:
    id: 'first-run'
- assertVisible:
    id: 'translator-screen'
