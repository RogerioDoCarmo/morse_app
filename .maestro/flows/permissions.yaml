# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
#
# ⚠️ This flow deliberately never taps the primary action. Since guideline
# 5.1.1(iv) that button is the ONLY action, and it leads straight to the system
# dialog — which is the OS's to draw and not this app's to assert on. What is
# tested here is the half that belongs to the app: the rationale shown BEFORE
# the OS is asked, and the fact that it offers no way to skip the prompt.
#
# ⚠️ Each gate needs its own launch. The gate covers the app while it is up, so
# once a rationale is on screen there is nowhere to navigate to without
# answering the OS. That is the intended behaviour, not a limitation of this
# flow.
appId: com.rogeriodocarmo.morse
---
# ⚠️ Wrapped in a retry because the EMULATOR loses this, not the app — see the
# note in translator.yaml. `clearState` force-stops and relaunches, and the
# kill races the launch.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: unset
      - runFlow: ../dismiss-first-run.yaml

# Light is the channel that needs the camera — the torch has no permission of
# its own on either platform.
- tapOn:
    id: 'channel-light'
- assertVisible:
    id: 'permission-camera'
- assertVisible:
    id: 'permission-primary'

# ⚠️ THE REGRESSION GUARD FOR GUIDELINE 5.1.1(iv). App Review rejected
# 0.3.4 (13) partly because a "Not now" button here let the user close the
# rationale and DELAY the system request. Apple: "The user should always
# proceed to the permission request after the message." One action, and it
# leads to the prompt.
- assertNotVisible:
    id: 'permission-dismiss'

# ⚠️ AND A REFUSAL IS NOT SILENT. Apple's own 5.1.1(iv) notes asked for this:
# "If the user is trying to use a feature in the app that won't function
# without access to the microphone, it may be helpful to include a notification
# to inform the user and provide a link to the Settings app."
#
# Both call sites used to bail into silence — the microphone button went on
# looking ready while doing nothing when pressed. The unit tests cover the
# wording; what needs a device is that the OS prompt's "Don't Allow" actually
# lands here, which no fake can tell us.
#
# ⚠️ The system dialog is the OS's to draw and this flow does not tap it — see
# the header. So the refusal is reached the way a real user reaches it a second
# time: with the permission already denied at launch, the gate opens in its
# blocked form, and `permission-dismiss` is the way back to the screen.

# The microphone gate, reached from the Speak tab. Same shape, same guard —
# and a fresh launch, because the camera gate above is still up.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: unset
      - runFlow: ../dismiss-first-run.yaml
- tapOn:
    id: 'tab-speak'
- assertVisible:
    id: 'speech-screen'
- tapOn:
    id: 'mic-button'
- assertVisible:
    id: 'permission-microphone'
- assertVisible:
    id: 'permission-primary'
- assertNotVisible:
    id: 'permission-dismiss'

# And the app is still usable with neither permission granted, which is the
# promise both rationale screens make. Neither gate was answered above, so
# nothing has been granted.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: unset
      - runFlow: ../dismiss-first-run.yaml
- assertVisible:
    id: 'translator-screen'
- tapOn:
    id: 'tab-speak'
- assertVisible:
    id: 'speech-screen'
- tapOn:
    id: 'tab-translate'
- assertVisible:
    id: 'translator-screen'

# ⚠️ A REFUSAL HAS TO LAND SOMEWHERE, and this is the half only a device can
# check. Both call sites used to bail into silence: the gate closed, the screen
# stayed exactly as it was, and the microphone button went on looking ready
# while doing nothing when pressed.
#
# Reached the way a real user reaches it — the permission already denied at the
# OS level, so the gate opens in its blocked form and `permission-dismiss` is
# the way back. That path is the one the unit tests cannot reach: it needs a
# real denial recorded by the system, not a fake that answers `false`.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          permissions:
            microphone: deny
      - runFlow: ../dismiss-first-run.yaml
- tapOn:
    id: 'tab-speak'
- assertVisible:
    id: 'speech-screen'
- tapOn:
    id: 'mic-button'

# Denied at the system level means iOS and Android will not prompt again, so
# the gate opens already blocked: the way forward is the settings app.
- assertVisible:
    id: 'permission-microphone'
- assertVisible:
    id: 'permission-primary'
- assertVisible:
    id: 'permission-dismiss'

# ⚠️ AND GOING BACK DOES NOT STRAND THE USER. This is the case that was
# reported: the gate closes and the screen behind it has to say why the
# microphone will not start, with a way to fix it. It used to say nothing at
# all — `speech-open-settings` did not exist.
- tapOn:
    id: 'permission-dismiss'
- assertVisible:
    id: 'speech-screen'
- assertVisible:
    id: 'speech-open-settings'

# The rest of the app is untouched by a refused microphone, which is the
# promise the rationale screen makes.
- tapOn:
    id: 'tab-translate'
- assertVisible:
    id: 'translator-screen'
