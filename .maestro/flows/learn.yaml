# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
# ⚠️ Wrapped in a retry because the EMULATOR loses this, not the app. Twice in
# two runs a flow starting straight after a heavy one found no app at all:
#
#   ActivityManager: Force stopping com.rogeriodocarmo.morse ...
#   ActivityManager: Start proc ... for next-top-activity MainActivity
#   ActivityManager: Killing ... (adj -10000): remove task
#   DeadObjectException: ... remote process probably died, but this could also
#     be caused by running out of binder buffer space
#
# `clearState` force-stops and relaunches, and the kill races the launch. There
# is nothing to fix in the app, and a red suite for it teaches nobody anything.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: ../dismiss-first-run.yaml

- tapOn:
    id: 'tab-learn'
- assertVisible:
    id: 'learn-screen'
- assertVisible:
    id: 'learn-alphabet'

# The grid looks like a table, so nothing about it says the cells can be
# pressed. A TestFlight tester finished 0.3.4 without ever discovering that the
# Translator's chips play; this line is the one that says so here, and a
# reference table with the invitation missing is back where that started.
- assertVisible:
    id: 'learn-tap-hint'
# And a cell takes a press. The SOUND is `LearnScreen.test.tsx`'s job — it can
# assert the exact WAV — so what this covers is that the cell is a control at
# all and that pressing one leaves the screen standing.
- tapOn:
    id: 'learn-letter'
    index: 0
- assertVisible:
    id: 'learn-screen'
- scrollUntilVisible:
    element:
      id: 'learn-gaps'
    direction: DOWN

# Tips has no tab of its own — Learn is the only route in. The card sits under
# the alphabet, so on a phone it starts below the fold: scroll to it rather
# than asserting it is already on screen.
- scrollUntilVisible:
    element:
      id: 'learn-tips'
    direction: DOWN
- tapOn:
    id: 'learn-tips'
- assertVisible:
    id: 'tips-screen'
- assertVisible:
    id: 'tip-1'
# Last card in a scroll of six, so it needs the same treatment.
- scrollUntilVisible:
    element:
      id: 'tip-avoid'
    direction: DOWN
- assertNotVisible:
    id: 'learn-screen'

# And back out, which is the half of navigation that usually breaks — more so
# here, where the way back is a single arrow rather than a tab.
- tapOn:
    id: 'tips-back'
- assertVisible:
    id: 'learn-screen'
- assertNotVisible:
    id: 'tips-screen'

# Every tab reaches a screen now; none are greyed.
- tapOn:
    id: 'tab-translate'
- assertVisible:
    id: 'translator-screen'
