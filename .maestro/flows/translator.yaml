# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
# ⚠️ Wrapped in a retry because the EMULATOR loses this, not the app. Twice in
# two runs a flow starting straight after a heavy one found no app at all:
#
#   ActivityManager: Force stopping com.rogeriodocarmo.morse ...
#   ActivityManager: Start proc ... for next-top-activity MainActivity
#   ActivityManager: Killing ... (adj -10000): remove task
#   DeadObjectException: ... remote process probably died, but this could also
#     be caused by running out of binder buffer space
#
# `clearState` force-stops and relaunches, and the kill races the launch. There
# is nothing to fix in the app, and a red suite for it teaches nobody anything.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: ../dismiss-first-run.yaml
- assertVisible:
    id: 'translator-screen'
- assertVisible:
    id: 'morse-output'
- tapOn:
    id: 'translator-input'
# The field is seeded with sample text, so tapping lands the cursor mid-string
# and inputText would splice into it — the run before this produced
# "Hello worlSOSd". Clear first so the flow asserts on what it actually typed.
- eraseText
- inputText: 'SOS'
# Return, not hideKeyboard: this is the way out a person actually has, and the
# one TestFlight's first hardware testers could not find. A multiline input
# would otherwise insert a newline and keep the keyboard up.
#
# The Android soft keyboard covers the lower half of the screen, so anything
# below the input is genuinely not visible until it is dismissed — which is
# what makes the assertion below mean something. The iOS simulator defaults to
# a hardware keyboard and never showed the problem, exactly the kind of
# cross-platform difference this tier exists to catch.
- pressKey: Enter
- assertVisible:
    id: 'signal-button'
# The raw string sits at the foot of the Morse card, and the card is now as
# tall as its content rather than as tall as the space left over. Even four
# letters overflow the scrolling region by a few dozen points on a 320dp
# screen, so this scrolls rather than assuming. It is one swipe here; the same
# assertion in audio-playback is fourteen rows down.
- scrollUntilVisible:
    element:
      id: 'morse-string'
    direction: DOWN
    timeout: 30000

# Characters with no Morse code are dropped. They used to be dropped silently,
# which left the sender believing the whole message went out. '#' is ASCII, so
# this types the same on both platforms' keyboards.
- tapOn:
    id: 'translator-input'
- eraseText
- inputText: 'HI #'
- hideKeyboard
- assertVisible:
    id: 'unsupported-notice'

# And the notice goes away once everything can be encoded again.
- tapOn:
    id: 'translator-input'
- eraseText
- inputText: 'HI'
- hideKeyboard
- assertNotVisible:
    id: 'unsupported-notice'

# Output is a CHANNEL now, not a switch you leave on. Turning one on arms it
# for the next run; it does not light or sound anything by itself.
#
# Screen rather than Light: the torch sits behind the camera permission, and a
# simulator has no camera to grant. permissions.yaml covers that gate; this
# flow is about the strip.
- tapOn:
    id: 'channel-screen'
- assertVisible:
    id: 'signal-button'

# ⚠️ The copy button did NOTHING until 0.3.2 — `onPress={() => undefined}`,
# drawn on the artboard and never wired. That is the same defect a tester
# reported against Speak in 0.2.1, and it is invisible from the outside: a
# control that does nothing looks exactly like one that is broken.
#
# There is no way to read the system clipboard from a flow, so what this can
# check is that pressing it says so — the tick on the button and the toast.
- tapOn:
    id: 'copy-morse'
# ⚠️ Toast first, icon second. The toast lingers six seconds and the tick only
# 1.8, so checking the short-lived one first spends the tick's whole life on
# the wrong assertion — which is how this flow failed the first time, on a slow
# emulator, before the two were given separate lifetimes at all.
- assertVisible:
    id: 'toast'
- assertVisible:
    id: 'icon-check'

# ⚠️ And that the tick REVERTS. A button stuck on a tick has stopped saying
# what it does and started saying what it did once. The wait is longer than
# the revert delay on purpose.
- extendedWaitUntil:
    visible:
      id: 'icon-copy'
    timeout: 5000

# The dot that replaced the auto-focus. It points at the input until the field
# is touched, and this flow has already typed into it.
- assertNotVisible:
    id: 'type-hint-dot'
