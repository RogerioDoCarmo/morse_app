# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
# ⚠️ Wrapped in a retry because the EMULATOR loses this, not the app. Twice in
# two runs a flow starting straight after a heavy one found no app at all:
#
#   ActivityManager: Force stopping com.rogeriodocarmo.morse ...
#   ActivityManager: Start proc ... for next-top-activity MainActivity
#   ActivityManager: Killing ... (adj -10000): remove task
#   DeadObjectException: ... remote process probably died, but this could also
#     be caused by running out of binder buffer space
#
# `clearState` force-stops and relaunches, and the kill races the launch. There
# is nothing to fix in the app, and a red suite for it teaches nobody anything.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: ../dismiss-first-run.yaml

- tapOn:
    id: 'tab-tap'
- assertVisible:
    id: 'tap-screen'
- assertVisible:
    id: 'tap-key'
# Nothing keyed yet, so the card holds the hint rather than a decoding.
- assertVisible:
    id: 'tap-empty'
- assertNotVisible:
    id: 'tap-clear'

# The four ways out are shown from the START, before there is anything to
# send. A TestFlight tester came to this screen looking for the vibration the
# Translator offers and did not find it; showing the strip only once they had
# already guessed it was there would repeat the mistake.
- assertVisible:
    id: 'output-channels'
- assertVisible:
    id: 'channel-buzz'
- assertVisible:
    id: 'channel-screen'
# That Emit refuses an EMPTY message is a unit test's job, not this one's.
# Asserting it here costs a scroll down to reach the button and a scroll back
# to carry on, and the first version of this flow did exactly that — then
# failed three steps later on `tap-back`, which the scroll had taken off
# screen. One scroll, at the end, with nothing after it.

# A quick tap is under the 180ms cut-off, so it is a dot.
#
# What this asserts is the DECODING, not the live letter row. Maestro's delay
# between steps is longer than the 540ms that closes a letter, so by the time
# it looks the row has already emptied — correctly. The row is covered by unit
# tests, which can hold the clock still; asserting it here only ever passed
# because the marks used to linger forever, which was the bug.
- tapOn:
    id: 'tap-key'
- assertVisible:
    id: 'tap-decoded'
- assertVisible:
    id: 'tap-clear'

# And the row empties once the letter is committed, which IS stable to assert
# for exactly the reason above.
- assertNotVisible:
    id: 'tap-mark-dot'

# A hold is over the cut-off, so it is a dash. Press DURATION is the entire
# input here, which is why this flow is worth having on a real device: a
# simulator and a thumb do not press for the same length of time.
- longPressOn:
    id: 'tap-key'
- assertVisible:
    id: 'tap-decoded'

# Back to the top, because everything after this is in the card the flow
# scrolled away from.

# Undoing the last mark. One press back, not one letter — everything on this
# screen is derived from the press list.
- assertVisible:
    id: 'tap-back'
- tapOn:
    id: 'tap-back'
- assertVisible:
    id: 'tap-decoded'

# Reading it back. AGENTS.md asks for this on tap input specifically: keying
# a message you cannot hear is how you find out you keyed it wrong only after
# reading it. Nothing to assert about the sound itself — the port is what a
# unit test checks — so this asserts the control is reachable and survives
# being used.
- assertVisible:
    id: 'tap-read'
- tapOn:
    id: 'tap-read'
- assertVisible:
    id: 'tap-decoded'

# And now there IS something to send, so the button offers itself. Started and
# stopped rather than left running: the next step clears the message out from
# under it.
# ⚠️ `swipe: from:` rather than `scrollUntilVisible`. The latter swipes from
# the CENTRE of the screen, and the centre of THIS screen is the key — a
# Pressable, which scrolls nothing. Runs on both platforms failed with "No
# visible element found" while their own screenshots showed a region that had
# never moved. Anchor the swipe inside the region you mean to scroll.
- swipe:
    from:
      id: 'tap-decoded'
    direction: UP
- assertVisible:
    id: 'signal-button'
    enabled: true
- tapOn:
    id: 'signal-button'
    waitToSettleTimeoutMs: 0
- tapOn:
    id: 'signal-button'

# Back to the top: the card head carries the steps below, and the strip is what
# is on screen to swipe from now.
- swipe:
    from:
      id: 'output-channels'
    direction: DOWN

- tapOn:
    id: 'tap-clear'
- assertVisible:
    id: 'tap-empty'
- assertNotVisible:
    id: 'tap-clear'
# It goes with the message it was going to read.
- assertNotVisible:
    id: 'tap-read'

# And back, which is the half of navigation that usually breaks.
- tapOn:
    id: 'tab-translate'
- assertVisible:
    id: 'translator-screen'
