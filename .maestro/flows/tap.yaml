# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
- launchApp:
    clearState: true
- runFlow: ../dismiss-first-run.yaml

- tapOn:
    id: 'tab-tap'
- assertVisible:
    id: 'tap-screen'
- assertVisible:
    id: 'tap-key'
# Nothing keyed yet, so the card holds the hint rather than a decoding.
- assertVisible:
    id: 'tap-empty'
- assertNotVisible:
    id: 'tap-clear'

# A quick tap is under the 180ms cut-off, so it is a dot.
#
# What this asserts is the DECODING, not the live letter row. Maestro's delay
# between steps is longer than the 540ms that closes a letter, so by the time
# it looks the row has already emptied — correctly. The row is covered by unit
# tests, which can hold the clock still; asserting it here only ever passed
# because the marks used to linger forever, which was the bug.
- tapOn:
    id: 'tap-key'
- assertVisible:
    id: 'tap-decoded'
- assertVisible:
    id: 'tap-clear'

# And the row empties once the letter is committed, which IS stable to assert
# for exactly the reason above.
- assertNotVisible:
    id: 'tap-mark-dot'

# A hold is over the cut-off, so it is a dash. Press DURATION is the entire
# input here, which is why this flow is worth having on a real device: a
# simulator and a thumb do not press for the same length of time.
- longPressOn:
    id: 'tap-key'
- assertVisible:
    id: 'tap-decoded'

# The cut-off is a setting because "long" is relative to the operator.
- assertVisible:
    id: 'cutoff-value'
- tapOn:
    id: 'cutoff-down'
- tapOn:
    id: 'cutoff-up'

# Undoing the last mark. One press back, not one letter — everything on this
# screen is derived from the press list.
- assertVisible:
    id: 'tap-back'
- tapOn:
    id: 'tap-back'
- assertVisible:
    id: 'tap-decoded'

# Reading it back. AGENTS.md asks for this on tap input specifically: keying
# a message you cannot hear is how you find out you keyed it wrong only after
# reading it. Nothing to assert about the sound itself — the port is what a
# unit test checks — so this asserts the control is reachable and survives
# being used.
- assertVisible:
    id: 'tap-read'
- tapOn:
    id: 'tap-read'
- assertVisible:
    id: 'tap-decoded'

- tapOn:
    id: 'tap-clear'
- assertVisible:
    id: 'tap-empty'
- assertNotVisible:
    id: 'tap-clear'
# It goes with the message it was going to read.
- assertNotVisible:
    id: 'tap-read'

# And back, which is the half of navigation that usually breaks.
- tapOn:
    id: 'tab-translate'
- assertVisible:
    id: 'translator-screen'
