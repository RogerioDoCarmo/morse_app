# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
- launchApp:
    clearState: true
- runFlow: ../dismiss-first-run.yaml
- assertVisible:
    id: 'translator-screen'

# The message has to LAST a long time without BEING long, and those pull in
# opposite directions.
#
# Each section below starts its own run and stops it, so the run has to outlive
# a whole section — 34 seconds of wall clock, measured on the CI simulator.
# Letting many assertions ride one run is what made this flaky originally: the
# message ended underneath them and a check that had passed moments earlier
# began to fail.
#
# But typing more characters is not the way to get there. The input card cannot
# shrink and the Morse card absorbs every shortfall, so a few lines of text
# squeeze the output to nothing: on Android the dots and dashes left the view
# hierarchy entirely and `morse-letter` could not be found, and on iOS twenty
# SOS filled the screen so completely that `hideKeyboard` had nowhere to tap
# and failed outright. Both were the same mistake, made once here.
#
# So: fourteen zeros, at the slowest speed the app offers.
#
#   - zeros are the densest characters in Morse — five dashes each, 19 units
#     with the gap, against 5 for an S. Fourteen of them is 305 units in as
#     many characters as "SOS SOS SOS SOS".
#   - 5 wpm is 240ms a unit rather than the 120ms default, which doubles the
#     clock without adding a single character.
#
# 305 units x 240ms is 73 seconds against a 34-second section. The arithmetic
# is checked in maestro-flows.test.ts against the app's own timing domain, so
# it cannot quietly stop being true.
- tapOn:
    id: 'open-settings'
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'segment-5'
- tapOn:
    id: 'settings-back'
- assertVisible:
    id: 'translator-screen'

# ⚠️ `eraseText` deletes BACKWARDS from wherever the tap left the caret, so
# whatever sat to the right of it survives — the recorded run typed its message
# and kept the "d" from the seeded "Hello world". It is bounded by the length of
# the sample and it only ever ADDS to the playback, never shortens it, so the
# margin above absorbs it. Worth knowing before reading a duration off this file
# as exact.
- tapOn:
    id: 'translator-input'
- eraseText
- inputText: '00000000000000'
- hideKeyboard

# `waitToSettleTimeoutMs: 0` on every tap taken while a message is playing.
#
# After a tap Maestro waits for the view hierarchy to stop changing. This app
# animates a progress bar, a clock and the lit letter throughout a run, so it
# never stops changing and the wait runs to its timeout. The CI recording is
# unambiguous: asserts took 0.3s each, every tap took 11.6-12.1s, and the tap
# on a letter mid-message took 21.7s. That section spent 34s inside a message
# that lasted 32, and the assertion after it opened two seconds too late —
# "Assertion is false: id: playback-progress is visible". Nothing was wrong
# with the app; the unit tests covering these same behaviours never wavered.
#
# ⚠️ Whether the flag actually helps is UNMEASURED. The reasoning above is
# sound and the numbers it rests on are real, but no run has ever compared the
# two: four alternating runs on a simulator put the difference well inside that
# machine's own variance — two control runs disagreed with each other by 2.5x
# on the same taps — and CI keeps a Maestro recording only when a flow fails,
# so the green run that would settle it uploads nothing.
#
# What IS known: Maestro parses the field and applies it to exactly these seven
# taps and no others, which the recording confirms.
#
# So the duration is what this flow relies on, and the flag is kept because it
# costs nothing and addresses the mechanism the failure pointed at — not
# because it has been shown to work. Do not shorten the message on the strength
# of it.

# --- what only exists while a message is running ---
- tapOn:
    id: 'signal-button'
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'playing-badge'
- assertVisible:
    id: 'playback-progress'
- assertVisible:
    id: 'playback-clock'
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playback-progress'
- assertNotVisible:
    id: 'playing-badge'

# --- tapping a letter mid-message is ignored ---
# The port plays one thing at a time, so a preview would replace the message.
#
# Every start and every stop is asserted before the next step. Two taps in a
# row on the same control is how this flow went flaky: the second landed
# before the first had taken effect, and a later assertion paid for it.
- tapOn:
    id: 'signal-button'
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'morse-letter'
    index: 0
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playback-progress'

# --- one run, several channels ---
# A channel switched on mid-message joins the run already in progress rather
# than starting a second one beside it.
#
# Screen rather than Light: the torch sits behind the camera permission, and a
# simulator has no camera for it to grant. permissions.yaml covers that gate.
# Switched off again once the run has stopped, so the sections below still
# start from the strip they expect — sound on, everything else off.
- tapOn:
    id: 'signal-button'
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'channel-screen'
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playback-progress'
# Only now put the channel back. Two taps on one control with nothing asserted
# between them is how the second gets swallowed — and with the screen channel
# still on, the surface covers the button the next step needs.
- tapOn:
    id: 'channel-screen'

# --- a letter preview, now that nothing is running ---
- tapOn:
    id: 'morse-letter'
    index: 1
- assertNotVisible:
    id: 'playback-progress'
- assertNotVisible:
    id: 'playing-badge'

# --- the screen channel takes the card over while it carries the message ---
# The chips are a reading aid; the square IS the message at that moment.
- tapOn:
    id: 'channel-screen'
- tapOn:
    id: 'signal-button'
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'signal-surface'
- assertNotVisible:
    id: 'morse-output'
- tapOn:
    id: 'signal-button'
- assertVisible:
    id: 'morse-output'
- assertNotVisible:
    id: 'signal-surface'
- tapOn:
    id: 'channel-screen'

# --- vibration is a channel like any other ---
# On iOS it cannot vary a vibration's LENGTH, so it fires a pulse at each
# mark's start with intensity carrying dot from dash. Nothing to assert
# visually; this is here so the path runs on a real device.
- tapOn:
    id: 'channel-buzz'
- tapOn:
    id: 'signal-button'
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playback-progress'
- tapOn:
    id: 'channel-buzz'

# --- nothing switched on means nothing to signal with ---
# Sound is the only one still on by now; every other section put its own
# channel back.
- tapOn:
    id: 'channel-sound'
- assertVisible:
    id: 'signal-button'
    enabled: false

# The output survives all of it rather than being replaced.
- assertVisible:
    id: 'morse-output'
- assertVisible:
    id: 'morse-string'
