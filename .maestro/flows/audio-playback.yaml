# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
- launchApp:
    clearState: true
- runFlow: ../dismiss-first-run.yaml
- assertVisible:
    id: 'translator-screen'

# A long message rather than the seeded sample: the sample follows the device
# locale, and at the 120ms default it lasts about eleven seconds — less than
# this flow takes. This one runs for roughly half a minute.
#
# Each section below STARTS ITS OWN RUN and stops it. Letting many assertions
# ride one run is what made this flaky: the message ended underneath them, and
# a check that had passed moments earlier began to fail.
- tapOn:
    id: 'translator-input'
- eraseText
- inputText: 'SOS SOS SOS SOS SOS SOS SOS SOS'
- hideKeyboard

# --- what only exists while a message is running ---
- tapOn:
    id: 'signal-button'
- assertVisible:
    id: 'playing-badge'
- assertVisible:
    id: 'playback-progress'
- assertVisible:
    id: 'playback-clock'
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playback-progress'
- assertNotVisible:
    id: 'playing-badge'

# --- tapping a letter mid-message is ignored ---
# The port plays one thing at a time, so a preview would replace the message.
#
# Every start and every stop is asserted before the next step. Two taps in a
# row on the same control is how this flow went flaky: the second landed
# before the first had taken effect, and a later assertion paid for it.
- tapOn:
    id: 'signal-button'
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'morse-letter'
    index: 0
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playback-progress'

# --- one run, several channels ---
# A channel switched on mid-message joins the run already in progress rather
# than starting a second one beside it.
#
# Screen rather than Light: the torch sits behind the camera permission, and a
# simulator has no camera for it to grant. permissions.yaml covers that gate.
# Switched off again straight away so the sections below still start from the
# strip they expect — sound on, everything else off.
- tapOn:
    id: 'signal-button'
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'channel-screen'
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'channel-screen'
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playback-progress'

# --- a letter preview, now that nothing is running ---
- tapOn:
    id: 'morse-letter'
    index: 1
- assertNotVisible:
    id: 'playback-progress'
- assertNotVisible:
    id: 'playing-badge'

# --- the screen channel takes the card over while it carries the message ---
# The chips are a reading aid; the square IS the message at that moment.
- tapOn:
    id: 'channel-screen'
- tapOn:
    id: 'signal-button'
- assertVisible:
    id: 'signal-surface'
- assertNotVisible:
    id: 'morse-output'
- tapOn:
    id: 'signal-button'
- assertVisible:
    id: 'morse-output'
- assertNotVisible:
    id: 'signal-surface'
- tapOn:
    id: 'channel-screen'

# --- vibration is a channel like any other ---
# On iOS it cannot vary a vibration's LENGTH, so it fires a pulse at each
# mark's start with intensity carrying dot from dash. Nothing to assert
# visually; this is here so the path runs on a real device.
- tapOn:
    id: 'channel-buzz'
- tapOn:
    id: 'signal-button'
- assertVisible:
    id: 'playback-progress'
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playback-progress'
- tapOn:
    id: 'channel-buzz'

# --- nothing switched on means nothing to signal with ---
# Sound is the only one still on by now; every other section put its own
# channel back.
- tapOn:
    id: 'channel-sound'
- assertVisible:
    id: 'signal-button'
    enabled: false

# The output survives all of it rather than being replaced.
- assertVisible:
    id: 'morse-output'
- assertVisible:
    id: 'morse-string'
