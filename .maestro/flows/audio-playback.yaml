# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'translator-screen'

# Type a long message rather than using the seeded sample. Two reasons: the
# sample follows the device locale, and at the 120ms default it lasts about
# eleven seconds — less than this flow takes to reach the assertions below, so
# playback ended underneath them. This one runs for roughly half a minute.
- tapOn:
    id: 'translator-input'
- eraseText
- inputText: 'SOS SOS SOS SOS SOS SOS'
- hideKeyboard

- tapOn:
    id: 'play-audio'

# The three things that only exist while a message is playing.
- assertVisible:
    id: 'playing-badge'
- assertVisible:
    id: 'playback-progress'
- assertVisible:
    id: 'playback-clock'

# Tapping a letter while the message runs is ignored. The port plays one thing
# at a time, so a preview would replace the message mid-transmission.
- tapOn:
    id: 'morse-letter'
    index: 0
- assertVisible:
    id: 'playing-badge'
- assertVisible:
    id: 'playback-progress'

# Pressing it again stops: the same control, now showing a stop glyph.
- tapOn:
    id: 'play-audio'
- assertNotVisible:
    id: 'playback-progress'
- assertNotVisible:
    id: 'playing-badge'

# Now that nothing is running, a letter tap previews just that letter — the
# card has always said "tap a letter to hear it".
- tapOn:
    id: 'morse-letter'
    index: 1

# A preview reports no progress. One letter is at most eleven units, and a bar
# that appeared and vanished inside a second would read as a glitch.
- assertNotVisible:
    id: 'playback-progress'
- assertNotVisible:
    id: 'playing-badge'

# The Morse output survives all of it rather than being replaced.
- assertVisible:
    id: 'morse-output'
- assertVisible:
    id: 'morse-string'
