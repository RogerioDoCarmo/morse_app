# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
appId: com.rogeriodocarmo.morse
---
# ⚠️ Wrapped in a retry because the EMULATOR loses this, not the app. Twice in
# two runs a flow starting straight after a heavy one found no app at all:
#
#   ActivityManager: Force stopping com.rogeriodocarmo.morse ...
#   ActivityManager: Start proc ... for next-top-activity MainActivity
#   ActivityManager: Killing ... (adj -10000): remove task
#   DeadObjectException: ... remote process probably died, but this could also
#     be caused by running out of binder buffer space
#
# `clearState` force-stops and relaunches, and the kill races the launch. There
# is nothing to fix in the app, and a red suite for it teaches nobody anything.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: ../dismiss-first-run.yaml

# Settings is not a tab: the gear on the Translator is the only way in.
- tapOn:
    id: 'open-settings'
- assertVisible:
    id: 'settings-screen'
- assertNotVisible:
    id: 'tab-translate'

# The cut-off the tap key reads. Nudged through the slider's accessibility
# action rather than by dragging, so the assertion does not depend on where a
# gesture happens to land on this device's width.
- assertVisible:
    id: 'settings-cutoff'

# Speed is the setting with the furthest reach — it changes what the audio
# renderer is handed — so it is the one worth pressing here.
- tapOn:
    id: 'segment-15'

# Both switches, off and on again. A switch that cannot come back is the
# failure that would strand a user who turned crash reports off by accident.
# Five sections deep, so scroll to it rather than trusting the fold.
- scrollUntilVisible:
    element:
      id: 'settings-crash-reports'
    direction: DOWN
- tapOn:
    id: 'settings-crash-reports'
- tapOn:
    id: 'settings-crash-reports'

# The only way back to the welcome guide once it has been skipped. It opens
# over Settings and returns here, rather than dropping the user somewhere else.
#
# ⚠️ IF THIS SECTION GOES RED, SUSPECT THE OPERATING SYSTEM BEFORE THE APP.
# Three runs failed here on 14 September on `assertVisible: settings-screen`,
# and the screenshot showed iOS SETTINGS, on the Apple Intelligence & Siri
# pane, with "◀ OmniMorse" in the status bar. The app had not failed to show
# its Settings screen — it had lost the foreground entirely.
#
# What happens: iOS posts a one-off "Apple Intelligence is ready" banner the
# first time a device boots after an erase. `first-run-skip` sits at y=84,
# directly under the status bar, which is exactly where a banner is drawn.
# Maestro aimed a tap at (363, 84); the banner appeared 313ms later and took
# it; SpringBoard opened `prefs:root=SIRI&path=appleIntelligenceCFU`.
#
# Why only this flow: `settings` is ALWAYS first in the suite, so it is the one
# occupying the minutes just after boot. `e2e.yml` now boots the simulator
# twelve minutes ahead of the flows so the callout is spent on an empty screen
# — do not move that boot back down next to the flows.
#
# ⚠️ `Linking.openSettings()` DOES exist in this app, in PermissionScreen, so
# it looks guilty. It is not: no flow taps `permission-primary` (check with
# `grep -rn permission-primary .maestro/`), and the log names SpringBoard's own
# pid as the process that opened the URL.
- scrollUntilVisible:
    element:
      id: 'settings-show-guide'
    direction: DOWN
- tapOn:
    id: 'settings-show-guide'
- assertVisible:
    id: 'first-run'
- tapOn:
    id: 'first-run-skip'
- assertNotVisible:
    id: 'first-run'
- assertVisible:
    id: 'settings-screen'

# Which build this is. The only thing on the phone that says so — App
# Distribution hands out several a day and they are identical from the inside.
#
# Scrolled to rather than asserted where it stands: it is the LAST thing on
# the last screen, and the guide round trip above unmounts Settings, so the
# scroll position is back at the top by the time this runs.
- scrollUntilVisible:
    element:
      id: 'settings-version'
    direction: DOWN

# ABOUT leaves for Learn, which is a different screen rather than a modal.
- scrollUntilVisible:
    element:
      id: 'settings-about-morse'
    direction: DOWN
- tapOn:
    id: 'settings-about-morse'
- assertVisible:
    id: 'learn-screen'
- assertNotVisible:
    id: 'settings-screen'

# Back in, and out by the arrow this time, which is the half of navigation
# that usually breaks.
- tapOn:
    id: 'tab-translate'
- tapOn:
    id: 'open-settings'
- tapOn:
    id: 'settings-back'
- assertVisible:
    id: 'translator-screen'
- assertNotVisible:
    id: 'settings-screen'

# The choice survives leaving the screen — the point of storing it at all.
- tapOn:
    id: 'open-settings'
- assertVisible:
    id: 'settings-screen'
