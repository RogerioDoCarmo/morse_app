# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
#
# The one exception is deliberate: after tapping `interface-en` the interface
# IS English whatever the device says, so English text is a fair assertion
# there — and the only way to prove the tap did anything, since a language
# switch changes no testID.
appId: com.rogeriodocarmo.morse
---
# ⚠️ Wrapped in a retry because the EMULATOR loses this, not the app. Twice in
# two runs a flow starting straight after a heavy one found no app at all:
#
#   ActivityManager: Force stopping com.rogeriodocarmo.morse ...
#   ActivityManager: Start proc ... for next-top-activity MainActivity
#   ActivityManager: Killing ... (adj -10000): remove task
#   DeadObjectException: ... remote process probably died, but this could also
#     be caused by running out of binder buffer space
#
# `clearState` force-stops and relaunches, and the kill races the launch. There
# is nothing to fix in the app, and a red suite for it teaches nobody anything.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: ../dismiss-first-run.yaml

# Language has no tab and no gear — Settings is the only route in.
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element:
      id: 'settings-language'
    direction: DOWN
- tapOn:
    id: 'settings-language'
- assertVisible:
    id: 'language-screen'
- assertVisible:
    id: 'language-interface'

# Force English, then read it back.
- tapOn:
    id: 'interface-en'
- assertVisible: 'Language'
- assertVisible: 'SPEECH RECOGNITION'

# ⚠️ The recogniser list is ALWAYS here now, and this section used to assert
# the opposite. Recognition followed the app language unless a "Match the
# interface" switch was turned off, so changing the interface silently pointed
# the microphone at a recogniser the phone might not have installed. 0.3.3
# removed the coupling and the switch with it.
#
# `assertNotVisible: language-recogniser` passed only because the list was
# hidden behind that switch. It kept passing for exactly as long as the defect
# existed, and failed the moment the fix landed — which is the correct way
# round, but only if somebody updates the flow. Eight unit tests were rewritten
# for this change and this one was missed.
- assertVisible:
    id: 'language-recogniser'
- scrollUntilVisible:
    element:
      id: 'recogniser-es'
    direction: DOWN
- tapOn:
    id: 'recogniser-es'

# ⚠️ And the INTERFACE did not follow it. A Spanish recogniser must leave the
# app in English — that separation is the whole point of the change, and the
# two settings sit on one screen four rows apart, which is precisely where a
# regression would go unnoticed.
- assertVisible: 'SPEECH RECOGNITION'
- assertVisible: 'INTERFACE'

# Back out through Settings, which is where it was opened from.
- tapOn:
    id: 'language-back'
- assertVisible:
    id: 'settings-screen'
- assertNotVisible:
    id: 'language-screen'
- tapOn:
    id: 'settings-back'
- assertVisible:
    id: 'translator-screen'

# ── The header badge agrees with this screen ────────────────────────────────
# ⚠️ It had NO `onPress` until 0.3.3 — drawn on the artboard and never wired,
# the third dead control from that source after Speak in 0.2.1 and Copy in
# 0.3.1. A missing handler fails nothing and looks identical to a broken one.
#
# ⚠️ It CYCLED for one version, and this flow asserted the cycle. Both are gone:
# the badge opens a list now, and `translator.yaml` owns the menu's own
# behaviour. What is left here is the thing only this flow can see — that the
# two places the interface language can be set agree with each other.
#
# The interface was forced to English above, so the badge must read EN.
- assertVisible:
    id: 'locale-badge-en'

# Set it from the HEADER, then read it back on the Language screen. These are
# two different controls writing one setting, and a menu that changed only the
# badge would look completely correct from the Translator.
- tapOn:
    id: 'locale-picker'
- tapOn:
    id: 'locale-option-pt-BR'
- assertVisible:
    id: 'locale-badge-pt-BR'
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element:
      id: 'settings-language'
    direction: DOWN
- tapOn:
    id: 'settings-language'

# ⚠️ The row's TICK, not the row itself and not a translated heading.
#
# All three rows exist in every language, so `assertVisible: interface-pt-BR`
# would pass on a screen that never changed — the shape of assertion that let a
# dead button through earlier in this project. Reading a translated heading
# fixed that and broke iOS, where an accessible container folds its children's
# text into its own label. `interface-pt-BR-tick` renders only on the SELECTED
# row and is an id on both platforms.
- scrollUntilVisible:
    element:
      id: 'interface-pt-BR-tick'
    direction: DOWN

# ⚠️ And the RECOGNISER did not move with it. Spanish was chosen above, and
# setting the interface from the HEADER must not repoint the microphone any
# more than setting it from this screen does — that is the coupling 0.3.3
# removed, and the header is a second door into the same setting.
#
# ⚠️ `scrollUntilVisible`, because this sits below the fold on an iPhone when
# the screen is re-entered. The first version asserted it outright and failed
# on iOS for that reason alone — the setting was correct, the row was simply
# off screen.
- scrollUntilVisible:
    element:
      id: 'recogniser-es-tick'
    direction: DOWN
- tapOn:
    id: 'language-back'
- tapOn:
    id: 'settings-back'
- assertVisible:
    id: 'translator-screen'
