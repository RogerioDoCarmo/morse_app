# Selectors are stable accessibility labels, never localised text — this app
# ships in three languages and the CI device locale is not guaranteed.
#
# The one exception is deliberate: after tapping `interface-en` the interface
# IS English whatever the device says, so English text is a fair assertion
# there — and the only way to prove the tap did anything, since a language
# switch changes no testID.
appId: com.rogeriodocarmo.morse
---
# ⚠️ Wrapped in a retry because the EMULATOR loses this, not the app. Twice in
# two runs a flow starting straight after a heavy one found no app at all:
#
#   ActivityManager: Force stopping com.rogeriodocarmo.morse ...
#   ActivityManager: Start proc ... for next-top-activity MainActivity
#   ActivityManager: Killing ... (adj -10000): remove task
#   DeadObjectException: ... remote process probably died, but this could also
#     be caused by running out of binder buffer space
#
# `clearState` force-stops and relaunches, and the kill races the launch. There
# is nothing to fix in the app, and a red suite for it teaches nobody anything.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: ../dismiss-first-run.yaml

# Language has no tab and no gear — Settings is the only route in.
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element:
      id: 'settings-language'
    direction: DOWN
- tapOn:
    id: 'settings-language'
- assertVisible:
    id: 'language-screen'
- assertVisible:
    id: 'language-interface'

# Force English, then read it back.
- tapOn:
    id: 'interface-en'
- assertVisible: 'Language'
- assertVisible: 'SPEECH RECOGNITION'

# The recogniser list is hidden while speech follows the interface, and that
# is the whole behaviour of this section.
- assertNotVisible:
    id: 'language-recogniser'
- tapOn:
    id: 'speech-follows'
- assertVisible:
    id: 'language-recogniser'
- scrollUntilVisible:
    element:
      id: 'recogniser-es'
    direction: DOWN
- tapOn:
    id: 'recogniser-es'

# Following again puts the list away — a switch that cannot come back would
# strand a user who opened it by accident.
- tapOn:
    id: 'speech-follows'
- assertNotVisible:
    id: 'language-recogniser'

# Back out through Settings, which is where it was opened from.
- tapOn:
    id: 'language-back'
- assertVisible:
    id: 'settings-screen'
- assertNotVisible:
    id: 'language-screen'
- tapOn:
    id: 'settings-back'
- assertVisible:
    id: 'translator-screen'

# ── The header badge on the Translator screen ───────────────────────────────
# ⚠️ It had NO `onPress` until 0.3.3 — drawn on the artboard and never wired,
# the third dead control from that source after Speak in 0.2.1 and Copy in
# 0.3.1. A missing handler fails nothing and looks identical to a broken one,
# so only a flow that presses it and reads the badge back can tell them apart.
#
# The interface was forced to English above, so the cycle starts somewhere
# known. All three taps are asserted: a picker that can leave a user in a
# language they cannot read, with no way back round, is worse than no picker.
- assertVisible: '^EN$'
- tapOn:
    id: 'locale-picker'
- assertVisible: '^PT$'
- tapOn:
    id: 'locale-picker'
- assertVisible: '^ES$'
- tapOn:
    id: 'locale-picker'
- assertVisible: '^EN$'
