# The Speak cell of the LinkedIn four-up.
#
# ⚠️ It shows the idle screen and does not start listening. There is no
# microphone on a CI emulator, so a tap on the mic would produce a
# permission dialog and then a recogniser that hears nothing — which is
# worse footage than the screen sitting still, and dishonest besides.
appId: com.rogeriodocarmo.morse
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: ../dismiss-first-run.yaml

# ⚠️ The shared lead-in. All four tab flows launch, dismiss the guide and tap
# exactly one tab before their own footage begins, because the four are played
# side by side and nothing else keeps them in step. See README.md.
- tapOn:
    id: 'tab-speak'
- assertVisible:
    id: 'speech-screen'
- waitForAnimationToEnd:
    timeout: 1500

- assertVisible:
    id: 'mic-button'
- waitForAnimationToEnd:
    timeout: 18000
