# The Translate cell of the LinkedIn four-up, and the only one that moves.
#
# ⚠️ This flow ENDS as soon as it has arrived. It does not try to hold still —
# `waitForAnimationToEnd` cannot do that, because its timeout is a MAXIMUM and
# it returns in under a second on a screen that is not animating. The dwell
# comes from tools/record-video-clips.sh, which records for a fixed length and
# never stops early, so the app rests here on camera after the flow returns.
#
# ⚠️ It taps its OWN tab, which it is already on, to keep its lead-in the
# same length as the other three.
appId: com.rogeriodocarmo.morse
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: ../dismiss-first-run.yaml

# ⚠️ The shared lead-in. All four tab flows launch, dismiss the guide and tap
# exactly one tab, because the four are played side by side. See README.md.
- tapOn:
    id: 'tab-translate'
- assertVisible:
    id: 'translator-screen'

# ⚠️ 5 WPM and a long message, both deliberate, and the same lesson
# `audio-playback.yaml` already encodes: SOS at the default speed finishes in
# about three seconds. The first recorded run asserted `playing-badge` and
# FAILED because the message had already stopped — and a cell that plays for
# three seconds of sixteen is a still image for the rest.
#
# Duration is bought with SPEED rather than with characters, so the screen
# shows a real phrase instead of a wall of filler.
- tapOn:
    id: 'open-settings'
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'segment-5'
- tapOn:
    id: 'settings-back'
- assertVisible:
    id: 'translator-screen'

- tapOn:
    id: 'translator-input'
- eraseText
# ⚠️ The message must outlast the RECORDING, not merely the assertion.
# "MORSE CODE" at 5 WPM plays for 21 seconds; the recorder rests 20 and then
# takes a while to stop, so playback finished about 24 seconds before the clip
# ended and the grid's 16-second window landed entirely in the static
# aftermath. The cell was correct and completely still.
#
# This one runs 58.8 seconds, so the recording stops while it is still
# flashing. video-assets.test.ts computes that from the app's OWN encoder and
# timeline rather than from a number typed here.
- inputText: 'OMNIMORSE ENCODE DECODE LEARN'
- hideKeyboard

# Screen and Vibrate, never Light — the camera permission dialog would land in
# the middle of a published video.
- tapOn:
    id: 'channel-screen'
- tapOn:
    id: 'channel-buzz'
# ⚠️ `waitToSettleTimeoutMs: 0`: the message plays continuously, so the screen
# never settles and Maestro would wait out its own timeout before moving on.
- tapOn:
    id: 'signal-button'
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'playing-badge'
