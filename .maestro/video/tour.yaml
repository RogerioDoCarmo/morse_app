# The Play Console promo video, which Play takes as a YouTube URL rather than
# an upload. Recorded top to tail, composed by `tools/compose-video.sh`.
#
# ⚠️ HOW DWELL WORKS HERE, because it is not obvious and the first two
# recorded runs got it wrong.
#
# `waitForAnimationToEnd: timeout: N` does NOT hold for N. N is a MAXIMUM: on a
# screen that is not animating it returns in under a second. It genuinely waits
# only while something IS moving — which is exactly the case during playback,
# when the screen is flashing and never settles. So it is used below only where
# the app really is animating, and everywhere else the dwell comes from a
# `repeat` of a cheap assertion, each iteration of which costs a real hierarchy
# fetch.
#
# ⚠️ AND THE WHOLE TOUR HAS TO FIT IN 180 SECONDS. `screenrecord` stops dead at
# its own ceiling, and the first version of this ran 175 seconds — it was still
# playing the message when the recording ended, and Speak, Tap and Learn were
# never captured at all. Nothing failed; the camera simply ran out.
#
# The dwell `repeat`s are what cost it: each iteration is a real hierarchy
# fetch, one to two seconds on a software-rendered emulator, and there were
# enough of them to account for most of those 175 seconds. They are halved
# here. If this tour grows again, that budget is the thing to check.
#
# ⚠️ The Light channel is never switched on, here or in any recorded flow. It
# raises the camera permission dialog, and a system dialog in a store asset is
# a rejection waiting to happen.
appId: com.rogeriodocarmo.morse
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - assertVisible:
          id: 'first-run'

# The carousel, swiped rather than skipped past — it is the first thing a new
# user sees, and it introduces the output channels the rest of the tour uses.
- repeat:
    times: 4
    commands:
      - assertVisible:
          id: 'first-run'
- swipe:
    from:
      id: 'first-run-pager'
    direction: LEFT
- repeat:
    times: 4
    commands:
      - assertVisible:
          id: 'first-run'
- swipe:
    from:
      id: 'first-run-pager'
    direction: LEFT
- repeat:
    times: 4
    commands:
      - assertVisible:
          id: 'first-run'

- tapOn:
    id: 'first-run-skip'
- assertNotVisible:
    id: 'first-run'
- hideKeyboard
- assertVisible:
    id: 'translator-screen'

# ⚠️ 5 WPM, the same lesson `audio-playback.yaml` already encodes. At the
# default speed the message finishes in about three seconds — the first
# recorded run asserted `playing-badge` here and FAILED because playback had
# already stopped. Duration is bought with SPEED rather than with characters,
# so the screen shows a real phrase rather than a wall of filler.
- tapOn:
    id: 'open-settings'
- assertVisible:
    id: 'settings-screen'
- repeat:
    times: 3
    commands:
      - assertVisible:
          id: 'settings-screen'
- tapOn:
    id: 'segment-5'
- tapOn:
    id: 'settings-back'
- assertVisible:
    id: 'translator-screen'

- tapOn:
    id: 'translator-input'
- eraseText
# ⚠️ The message must outlast the RECORDING, not merely the assertion.
# "MORSE CODE" at 5 WPM plays for 21 seconds; the recorder rests 20 and then
# takes a while to stop, so playback finished about 24 seconds before the clip
# ended and the grid's 16-second window landed entirely in the static
# aftermath. The cell was correct and completely still.
#
# This one runs 58.8 seconds, so the recording stops while it is still
# flashing. video-assets.test.ts computes that from the app's OWN encoder and
# timeline rather than from a number typed here.
- inputText: 'OMNIMORSE ENCODE DECODE LEARN'
- hideKeyboard
- repeat:
    times: 3
    commands:
      - assertVisible:
          id: 'translator-screen'

# The channel strip is the app's main control and the thing the listing leads
# with. Screen makes the playback visible in a silent video, which most feeds
# are.
- tapOn:
    id: 'channel-screen'
- tapOn:
    id: 'channel-buzz'

# ⚠️ `waitToSettleTimeoutMs: 0`. The message plays continuously, so the screen
# never settles and Maestro would wait out its own timeout before moving on.
- tapOn:
    id: 'signal-button'
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'playing-badge'
# ⚠️ The one place a long timeout really does hold: the screen is flashing, so
# animations never end and this waits the full amount.
- waitForAnimationToEnd:
    timeout: 22000
- tapOn:
    id: 'signal-button'
- assertNotVisible:
    id: 'playing-badge'

- tapOn:
    id: 'tab-speak'
- assertVisible:
    id: 'speech-screen'
- repeat:
    times: 5
    commands:
      - assertVisible:
          id: 'mic-button'

- tapOn:
    id: 'tab-tap'
- assertVisible:
    id: 'tap-screen'
# Three taps and three holds. What they decode to depends on how far apart
# Maestro's taps land, which on a software-rendered emulator is far enough that
# each commits as its own letter — so this does not claim a word.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: 'tap-key'
      - longPressOn:
          id: 'tap-key'
- assertVisible:
    id: 'tap-decoded'
- repeat:
    times: 4
    commands:
      - assertVisible:
          id: 'tap-decoded'

- tapOn:
    id: 'tab-learn'
- assertVisible:
    id: 'learn-screen'
- repeat:
    times: 3
    commands:
      - assertVisible:
          id: 'learn-alphabet'
- scroll
- repeat:
    times: 3
    commands:
      - assertVisible:
          id: 'learn-screen'
- scroll
- repeat:
    times: 4
    commands:
      - assertVisible:
          id: 'learn-screen'
