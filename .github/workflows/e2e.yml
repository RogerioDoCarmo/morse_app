name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Per REF on a pull request, so a new push supersedes the old run — that is
  # wanted, the old one tests code that no longer exists.
  #
  # Per COMMIT on main and develop, so runs there never share a group and can
  # never supersede each other. cancel-in-progress is not enough on its own:
  # GitHub cancels any previously PENDING run when a new one joins an occupied
  # group, whatever that setting says. These jobs queue for a long time
  # waiting on scarce macOS runners, so they are usually pending rather than
  # running — which is exactly when that rule bites.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Cancel superseded PR runs — a new push there makes the old one obsolete,
  # and these jobs are far too slow to leave queued for code that no longer
  # exists.
  #
  # NEVER cancel a run on main or develop. Each merge is a different commit
  # whose result was wanted, so cancelling trades knowing about one for
  # knowing about the next. Once these jobs started genuinely building both
  # platforms — 20 to 40 minutes, against roughly 20 seconds when they died
  # at the secret guard — merges began arriving inside that window and the
  # suite stopped ever reaching a verdict. Eight runs in one afternoon were
  # cancelled without a single one finishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Maestro on Android
    runs-on: ubuntu-latest
    # A hung build otherwise runs to GitHub's six-hour default before anyone
    # finds out. `./gradlew assembleRelease` sat here for over three hours on
    # 6 September and had reached neither Maestro nor a flow; a cold build of
    # this app is 10-25 minutes, so anything past 50 is stuck rather than slow.
    timeout-minutes: 50
    # Skipped for Dependabot and for forks, whose PRs GitHub deliberately
    # denies secrets. Without this the job cannot write the Firebase
    # credentials, fails on the secret guard within seconds, and leaves a red
    # check on every dependency bump — which is how a team learns to ignore
    # red checks. ci.yml already skips its SonarCloud step for the same reason.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.fork != true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOT setup-java's `cache: gradle`. That builds its key by hashing
      # gradle files, and there are none at checkout — `android/` is
      # gitignored and does not exist until `expo prebuild` runs below. The
      # action fails outright rather than skipping.
      #
      # Keyed on the files that DO exist and that actually decide what gets
      # compiled: the lockfile and the app config. Without a cache every run
      # recompiles every native module from scratch — Firebase, camera,
      # audio, speech recognition, SVG, reanimated.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'app.json', 'app.config.js') }}
          restore-keys: gradle-${{ runner.os }}-

      # Without KVM the emulator is software-rendered and glacial: boot took
      # 10.7 minutes on the first run here, and Maestro's driver then timed out
      # before it could attach. This is the fix, not a longer timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: pnpm install --frozen-lockfile

      # The Firebase config plugins only apply when this file is present, so
      # without it CI would build a different app from the one that ships —
      # exactly the divergence that hid three iOS build failures. Injected from
      # a secret rather than committed, since the repo is public.
      - name: Write Firebase credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set. Add it with: base64 -i google-services.json | pbcopy"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json
          jq -e '.project_info.project_id' google-services.json > /dev/null \
            || { echo "::error::GOOGLE_SERVICES_JSON did not decode to a valid google-services.json."; exit 1; }

      - name: Prebuild Android
        run: pnpm expo prebuild --platform android --no-install

      # Release, not debug: a debug APK fetches its JS bundle from the Metro dev
      # server, which is not running in CI, so the app launches to an error
      # screen and every flow fails on "screen is visible". A release build
      # embeds the bundle. Expo's generated release buildType signs with the
      # debug keystore, so this needs no secrets.
      # `expo-updates`' KSP step dies with OutOfMemoryError: Metaspace on a
      # shared runner, and Gradle then grinds on for the rest of the job
      # without ever producing an APK.
      #
      # METASPACE only. Raising the heap as well — 4g for Gradle, 2g for the
      # Kotlin daemon — moved the failure rather than removing it: Expo's
      # autolinking plugin shells out to node during configuration, and with
      # that much reserved it exited 1 before the build reached a single task.
      # The template's heap was never the problem; its 512m metaspace was.
      #
      # Written here rather than committed, because `android/` is gitignored
      # and regenerated by prebuild on every run — and because this is a CI
      # constraint. EAS builders have the memory already; their Android build
      # of this same commit succeeded.
      - name: Give Gradle and Kotlin room to compile
        run: |
          # The leading newline is load-bearing. prebuild writes this file
          # WITHOUT a trailing one, so appending directly ran the first
          # property onto the end of the last existing line and produced
          # `expo.inlineModules.watchedDirectories=[]org.gradle.jvmargs=...`.
          # That silently corrupted an autolinking property, and Expo's
          # autolinking plugin then exited 1 during configuration.
          printf '\n%s\n%s\n' \
            "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m" \
            "kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1024m" \
            >> android/gradle.properties
          echo "--- last four lines, each must start a line of its own ---"
          tail -4 android/gradle.properties

      # One ABI, not four. React Native compiles its native modules once per
      # architecture, and with no `reactNativeArchitectures` set the default
      # is armeabi-v7a, arm64-v8a, x86 AND x86_64 — roughly four times the
      # work. The emulator below is x86_64 only, so the other three are
      # compiled and then thrown away.
      #
      # This is scoped to CI on purpose: gradle.properties is left alone so a
      # real device build, and anything EAS produces, still covers every ABI.
      - name: Build release APK
        # --stacktrace because the failure this replaced reported only
        # "Process 'command 'node'' finished with non-zero exit value 1" with
        # no task name and none of node's own output — Expo's gradle scripts
        # shell out to node during CONFIGURATION, so there is no task to name
        # and nothing to go on without it.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --stacktrace
        working-directory: android

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The driver install is the slow part even with KVM; the default is
          # not generous enough on a shared runner.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/flows/

      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: ~/.maestro/tests/
          retention-days: 7

  ios:
    name: Maestro on iOS
    runs-on: macos-latest
    # Prebuild, CocoaPods, xcodebuild, then nine flows. The run that passed
    # eight of nine took about 25 minutes end to end.
    timeout-minutes: 50
    # Skipped for Dependabot and for forks, whose PRs GitHub deliberately
    # denies secrets. Without this the job cannot write the Firebase
    # credentials, fails on the secret guard within seconds, and leaves a red
    # check on every dependency bump — which is how a team learns to ignore
    # red checks. ci.yml already skips its SonarCloud step for the same reason.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.fork != true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not optional on iOS: @react-native-firebase/crashlytics autolinks a
      # build phase that reads GOOGLE_APP_ID out of this file, so the app fails
      # to build without it whether or not the Expo config plugins run.
      - name: Write Firebase credentials
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST is not set. Add it with: base64 -i GoogleService-Info.plist | pbcopy"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist
          plutil -lint GoogleService-Info.plist > /dev/null \
            || { echo "::error::GOOGLE_SERVICE_INFO_PLIST did not decode to a valid plist."; exit 1; }

      # No --no-install here: the .xcworkspace only exists once CocoaPods has
      # run, and xcodebuild needs the workspace rather than the bare project.
      - name: Prebuild iOS
        run: |
          pnpm expo prebuild --platform ios
          # `expo prebuild` reports "Command `pod install` failed" and still
          # exits 0. Without this check the job carried on to xcodebuild, which
          # failed with "'' is not a workspace file" — an opaque error 500 lines
          # below the one that mattered. Fail where the fault actually is.
          if ! ls -d ios/*.xcworkspace >/dev/null 2>&1; then
            echo "::error::pod install produced no ios/*.xcworkspace. The real failure is in the prebuild output above."
            exit 1
          fi

      - name: Build for the simulator
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Building scheme $scheme from $workspace"
          echo "IOS_SCHEME=$scheme" >> "$GITHUB_ENV"
          xcodebuild -workspace "$workspace" \
            -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Pick whatever iPhone this runner image actually ships. Hardcoding a
      # model name breaks silently every time GitHub rolls the image forward —
      # "iPhone 16" was not present and simctl failed with "Invalid device".
      - name: Boot a simulator and run flows
        env:
          # Maestro builds and launches its XCUITest driver on first use. A
          # cold runner does not manage that inside the default window, and
          # the failure does not read as a timeout — it reads as twenty
          # connection refusals on the driver's own port, with the flows never
          # starting.
          #
          # 180000 was enough for a while and then was not: run 34123106736
          # spent 3m32s in the step and gave up with IOSDriverTimeoutException,
          # having run no flows at all and uploaded a 6KB artifact. The number
          # is a per-attempt budget for something whose cost is set by how busy
          # a shared macOS runner is, so it is generous on purpose — nothing is
          # spent when the driver comes up quickly, and the job's own
          # timeout-minutes is the real backstop.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 360000
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator is available on this runner."
            exit 1
          fi
          echo "Using simulator $udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" \
            "ios/build/Build/Products/Release-iphonesimulator/${IOS_SCHEME}.app"
          maestro --device "$udid" test .maestro/flows/

      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios
          path: ~/.maestro/tests/
          retention-days: 7
