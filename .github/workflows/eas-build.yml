name: EAS build

# ⚠️ A RELEASE TAG, not every merge to main.
#
# This used to build on any push to main that touched src, app.json or the
# lockfile — path-filtered, which felt careful and was not nearly careful
# enough. Five merges to main in one evening cost seven iOS builds, and the
# free plan allows fifteen a month: the account hit 80% of its limit in a day,
# with nothing to show for six of them because each was superseded by the next
# merge before anyone submitted it.
#
# A tag is the honest trigger. It happens when someone has decided to release,
# which is exactly when a store binary is worth building — and the release
# convention already puts an annotated tag on main for every version.
#
# `workflow_dispatch` stays for the times a build is wanted without a release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options: [all, android, ios]

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    # Secrets are unavailable to Dependabot, and a bot PR should never build.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: eas build --platform ${{ inputs.platform || 'all' }} --profile production --non-interactive --no-wait

  submit:
    name: Submit to the stores
    # Deliberately opt-in only, and worth keeping that way now that the build
    # above is tag-triggered: a tag should produce a binary without also
    # pushing it at Apple. Submitting costs no build quota, so it can be done
    # at any time against a build that already exists —
    # `eas submit --platform ios --latest`.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: store-release
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Submit
        run: eas submit --platform ${{ inputs.platform || 'all' }} --profile production --non-interactive
