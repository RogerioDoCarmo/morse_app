name: Firebase App Distribution

on:
  push:
    branches: [develop]
    paths:
      - 'package.json'
  # A version bump is a heavy way to retry a distribution that failed for a
  # reason of its own — which is how the `--output` bug below went unnoticed
  # from the day this was written until the first bump ever fired it.
  workflow_dispatch:
    inputs:
      platform:
        # ⚠️ Retries are usually ONE-SIDED. iOS fails for reasons Android
        # cannot have — an ad-hoc profile with no registered devices, most
        # often — and rebuilding the good platform to retry the bad one costs a
        # second EAS build AND hands testers two identical releases they cannot
        # tell apart, which is the very thing the gate below exists to prevent.
        description: Platform to build and distribute
        required: true
        default: all
        type: choice
        options: [all, android, ios]

permissions:
  contents: read

jobs:
  gate:
    name: Check for a version bump
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Gate on an actual version change, not on every push. Distributing on
      # each push produces duplicate same-version releases that testers cannot
      # tell apart.
      - id: check
        run: |
          # Dispatched by hand means someone has already decided; the gate is
          # for the push trigger, which fires on every commit that touches
          # package.json whether or not the version moved.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Dispatched by hand; distributing whatever develop currently says."
            exit 0
          fi
          current=$(node -p "require('./package.json').version")
          previous=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "none")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $previous -> $current"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged at $current; nothing to distribute."
          fi

      # ⚠️ iOS goes out as an AD-HOC build, so every tester device must be
      # registered with `eas device:create` first and a new device needs a
      # rebuild — the UDID list is baked into the IPA at signing time.
      # TestFlight has no such limit and is handled by eas-build.yml's opt-in
      # submit job; this is the faster channel, not the only one.
      - id: plan
        run: |
          set -euo pipefail
          want='${{ inputs.platform || 'all' }}'
          all='{"include":[
            {"platform":"android","artifact":"build.apk","app_id_secret":"FIREBASE_ANDROID_APP_ID"},
            {"platform":"ios","artifact":"build.ipa","app_id_secret":"FIREBASE_IOS_APP_ID"}
          ]}'
          if [ "$want" = "all" ]; then
            matrix=$(jq -c . <<<"$all")
          else
            matrix=$(jq -c --arg p "$want" '{include: [.include[] | select(.platform == $p)]}' <<<"$all")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Distributing: $want"

  distribute:
    name: Distribute ${{ matrix.platform }}
    needs: gate
    if: needs.gate.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One platform failing should not deny testers the other.
      fail-fast: false
      # Built by the gate rather than written here, so a dispatch can ask for
      # one platform. `jobs.<id>.if` cannot see the `matrix` context, so
      # filtering has to happen before the matrix exists.
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # ⚠️ NOT `--output`. That flag is accepted only for `--local` builds, and
      # this is a cloud build: every run of this workflow died in seconds with
      # "--output is allowed only for local builds" — from the day it was
      # written until a version bump first fired it. A finished cloud build is
      # fetched from the URL it reports.
      - name: Build a preview binary
        run: |
          set -euo pipefail
          eas build --platform ${{ matrix.platform }} --profile preview \
            --non-interactive --wait --json > build.json
          # The field has moved between EAS versions, so take the first URL the
          # payload offers rather than naming one path through it.
          url=$(jq -r '[.. | objects
                        | (.applicationArchiveUrl? // .buildUrl?)
                        | select(. != null and . != "")] | first' build.json)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::The build finished but reported no artifact URL."
            cat build.json
            exit 1
          fi
          echo "Downloading $url"
          curl -fsSL -o "${{ matrix.artifact }}" "$url"
          ls -lh "${{ matrix.artifact }}"

      - name: Distribute to testers
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets[matrix.app_id_secret] }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: ${{ matrix.artifact }}
          releaseNotes: 'v${{ needs.gate.outputs.version }} from develop'
