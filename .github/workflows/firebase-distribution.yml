name: Firebase App Distribution

on:
  push:
    branches: [develop]
    paths:
      - 'package.json'
  # A version bump is a heavy way to retry a distribution that failed for a
  # reason of its own — which is how the `--output` bug below went unnoticed
  # from the day this was written until the first bump ever fired it.
  workflow_dispatch:
    inputs:
      platform:
        # ⚠️ Retries are usually ONE-SIDED. iOS fails for reasons Android
        # cannot have — an ad-hoc profile with no registered devices, most
        # often — and rebuilding the good platform to retry the bad one costs a
        # second EAS build AND hands testers two identical releases they cannot
        # tell apart, which is the very thing the gate below exists to prevent.
        description: Platform to build and distribute
        required: true
        default: all
        type: choice
        options: [all, android, ios]

permissions:
  contents: read

jobs:
  gate:
    name: Check for a version bump
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      blocked: ${{ steps.credits.outputs.blocked }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ⚠️ READ BEFORE ANYTHING CALLS `eas build`. This is the whole point of
      # the memo: `eas build` increments the REMOTE build counter and only then
      # finds out the balance is zero, so by the time the friendly "no credits"
      # handling below runs, a versionCode has already been spent on a binary
      # that does not exist. On 23 September that happened twice in eighty
      # seconds — Android 15 to 16, iOS 18 to 19 — from a version bump nobody
      # thought of as a build.
      - id: memo
        uses: actions/cache/restore@v4
        with:
          path: .eas-credit-block
          key: eas-credit-block-v1

      - id: credits
        run: |
          set -euo pipefail
          if [ ! -f .eas-credit-block ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "No credit block recorded."
            exit 0
          fi
          until=$(cat .eas-credit-block)
          # ⚠️ Fails OPEN. An unparseable or malformed date must let the build
          # through: refusing to build because a cache file is corrupt would be
          # this guard causing the outage it exists to prevent.
          if ! now=$(date -u +%s) || ! deadline=$(date -u -d "$until" +%s 2>/dev/null); then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read the recorded reset date (${until}); building anyway."
            exit 0
          fi
          if [ "$now" -lt "$deadline" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏸️ Skipped before spending a build number"
              echo
              echo "EAS reported its build allowance exhausted until **${until}**, and"
              echo "that has not passed yet. Nothing was sent to EAS."
              echo
              echo "⚠️ This is the step that protects the **build number**. Calling"
              echo "\`eas build\` here would increment the remote counter and only then"
              echo "be refused, burning a \`versionCode\`/\`buildNumber\` on a binary that"
              echo "never exists."
              echo
              echo "Dispatch this workflow by hand once the balance returns."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Distribution skipped::EAS credits recorded as exhausted until ${until}; no build was attempted."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "Recorded block expired on ${until}; proceeding."
          fi

      # Gate on an actual version change, not on every push. Distributing on
      # each push produces duplicate same-version releases that testers cannot
      # tell apart.
      - id: check
        run: |
          # Dispatched by hand means someone has already decided; the gate is
          # for the push trigger, which fires on every commit that touches
          # package.json whether or not the version moved.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Dispatched by hand; distributing whatever develop currently says."
            exit 0
          fi
          current=$(node -p "require('./package.json').version")
          previous=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "none")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $previous -> $current"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged at $current; nothing to distribute."
          fi

      # ⚠️ iOS goes out as an AD-HOC build, so every tester device must be
      # registered with `eas device:create` first and a new device needs a
      # rebuild — the UDID list is baked into the IPA at signing time.
      # TestFlight has no such limit and is handled by eas-build.yml's opt-in
      # submit job; this is the faster channel, not the only one.
      - id: plan
        run: |
          set -euo pipefail
          want='${{ inputs.platform || 'all' }}'
          all='{"include":[
            {"platform":"android","artifact":"build.apk"},
            {"platform":"ios","artifact":"build.ipa"}
          ]}'
          if [ "$want" = "all" ]; then
            matrix=$(jq -c . <<<"$all")
          else
            matrix=$(jq -c --arg p "$want" '{include: [.include[] | select(.platform == $p)]}' <<<"$all")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Distributing: $want"

  distribute:
    name: Distribute ${{ matrix.platform }}
    needs: gate
    if: needs.gate.outputs.bumped == 'true' && needs.gate.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    strategy:
      # One platform failing should not deny testers the other.
      fail-fast: false
      # Built by the gate rather than written here, so a dispatch can ask for
      # one platform. `jobs.<id>.if` cannot see the `matrix` context, so
      # filtering has to happen before the matrix exists.
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # ⚠️ NOT `--output`. That flag is accepted only for `--local` builds, and
      # this is a cloud build: every run of this workflow died in seconds with
      # "--output is allowed only for local builds" — from the day it was
      # written until a version bump first fired it. A finished cloud build is
      # fetched from the URL it reports.
      # ⚠️ RUNNING OUT OF BUILD CREDITS IS NOT A BUILD FAILURE, and this step
      # used to report it as one. On 17 September both platforms went red on a
      # release PR with "Build a preview binary — failure", which reads exactly
      # like the app not compiling. Nothing was wrong with the app: the EAS free
      # allowance for the month was spent, and it does not reset until the
      # billing period rolls over.
      #
      # A red check that means "the balance is zero" is worse than no check,
      # because it is indistinguishable from the one that means "this code is
      # broken" — and the cure for a check people learn to ignore is not a
      # better explanation in a comment somewhere, it is not going red.
      #
      # ⚠️ ONLY this one condition is forgiven. Any other non-zero exit from
      # `eas build` still fails the job, loudly. The point is to tell an empty
      # wallet apart from a broken build, not to stop noticing broken builds.
      - name: Build a preview binary
        id: build
        run: |
          set -uo pipefail
          # ⚠️ `set +e` around the build ONLY. With `set -e` the step dies on
          # eas's exit code before anything can look at WHY it exited.
          set +e
          eas build --platform ${{ matrix.platform }} --profile preview \
            --non-interactive --wait --json > build.json 2> build.err
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            # Always show it: a skipped distribution still has to be readable.
            cat build.err >&2
            if grep -qiE 'included build credits|builds from the Free plan|New builds are blocked' build.err; then
              # e.g. "will reset in 13 days (on Thu Oct 01 2026)"
              reset=$(grep -oiE 'will reset in [^.)]*\)?' build.err | head -1)
              {
                echo "### ⏸️ Distribution skipped — no EAS build credits"
                echo
                echo "**The app is fine. The allowance is not.** No binary was built and"
                echo "nothing was sent to Firebase App Distribution, so testers do not have"
                echo "\`v${{ needs.gate.outputs.version }}\` on **${{ matrix.platform }}**."
                echo
                [ -n "$reset" ] && echo "EAS says the balance ${reset}."
                echo
                echo "Re-running this will not help — it is a balance, not a flake."
                echo "When credits return, dispatch this workflow for the platform that"
                echo "needs it (\`workflow_dispatch\` → \`platform\`) rather than bumping the"
                echo "version again, and rather than rebuilding both sides."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Distribution skipped::No EAS build credits — ${{ matrix.platform }} was not built or distributed. ${reset}"
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              # The date EAS named, for the gate to read next time. Parsed out
              # of "will reset in 13 days (on Thu Oct 01 2026)"; if the wording
              # changes and the parse fails, nothing is written and the gate
              # keeps letting builds through, which is the safe direction.
              until=$(grep -oiE 'on [A-Z][a-z]{2} [A-Z][a-z]{2} [0-9]{1,2} [0-9]{4}' build.err | head -1 | sed 's/^on //')
              if [ -n "$until" ]; then
                echo "$until" > .eas-credit-block
                echo "blocked_until=$until" >> "$GITHUB_OUTPUT"
                echo "Recorded the block until $until."
              else
                echo "::warning::Could not parse a reset date out of the EAS output; the next run will try again and spend another build number."
              fi
              exit 0
            fi
            echo "::error::eas build exited ${status}. This is a real build failure, not the credit balance."
            exit 1
          fi

          # The field has moved between EAS versions, so take the first URL the
          # payload offers rather than naming one path through it.
          url=$(jq -r '[.. | objects
                        | (.applicationArchiveUrl? // .buildUrl?)
                        | select(. != null and . != "")] | first' build.json)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::The build finished but reported no artifact URL."
            cat build.json
            exit 1
          fi
          echo "Downloading $url"
          curl -fsSL -o "${{ matrix.artifact }}" "$url"
          ls -lh "${{ matrix.artifact }}"

      # ⚠️ SAVED ONLY ON THE CREDIT PATH. A cache written on every run would
      # keep a stale date alive; written here, it exists exactly when EAS has
      # said the balance is out, and the gate above deletes its own effect by
      # comparing against the date rather than against the file's existence.
      - name: Remember the block
        if: steps.build.outputs.blocked_until != ''
        uses: actions/cache/save@v4
        with:
          path: .eas-credit-block
          key: eas-credit-block-v1

      # ⚠️ There is no binary when the build was skipped, and this action would
      # fail on the missing file — turning the red check we just removed into a
      # red check one step later.
      - name: Distribute to testers
        if: steps.build.outputs.skipped != 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          # ⚠️ TWO STATIC REFERENCES, NOT `secrets[matrix.app_id_secret]`.
          # The dynamic form read the secret NAME out of the matrix, and
          # GitHub cannot know at parse time which key an expression will ask
          # for -- so it made the ENTIRE secrets context available to this
          # step. Every organization and repository secret, to a step that
          # needs one Firebase app id. CodeQL called it "Excessive Secrets
          # Exposure" and was right.
          #
          # ⚠️ IT MATTERS BECAUSE OF WHAT THIS STEP RUNS: a third-party action
          # on a MOVING TAG (@v1). Nothing has leaked; the point is blast
          # radius. If that tag were ever repointed, the difference between
          # "it can see one app id" and "it can see FIREBASE_SERVICE_ACCOUNT,
          # GOOGLE_SERVICES_JSON and SONAR_TOKEN" is this line.
          #
          # Both branches are static, so only these two secrets are
          # materialised. `platform` is present on every matrix entry -- the
          # plan step's jq filter selects ON it -- and the job name already
          # depends on it.
          appId: ${{ matrix.platform == 'android' && secrets.FIREBASE_ANDROID_APP_ID || secrets.FIREBASE_IOS_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: ${{ matrix.artifact }}
          releaseNotes: 'v${{ needs.gate.outputs.version }} from develop'
