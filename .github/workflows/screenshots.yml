name: Screenshots

# Store screenshots, captured from the app as it actually runs.
#
# ⚠️ Manual only. This builds the whole app to produce images, which is far too
# much work to do on every push — and the images are wanted at listing time,
# not continuously. `workflow_dispatch` from the Actions tab.
#
# Everything hard about getting this app onto an emulator — KVM, the Gradle
# memory that a bare runner does not have, the Firebase credentials, the
# prebuild — lives in `.github/actions/build-android-app`, shared with
# `videos.yml`. This header used to say that solving it twice is how the two
# drift, while containing the second copy; the action is that sentence taken
# seriously.
#
# The alternative was rendering mockups from the design canvas. That is what
# produced the last set, and they drifted: "Hello world" where the app seeds
# SOS, a "Flash it" button where it says "Signal", and no output-channel strip
# at all. A screenshot of the running app cannot drift from the running app.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Capture screenshots
    runs-on: ubuntu-latest
    # A hung build otherwise runs to GitHub's six-hour default before anyone
    # finds out. `./gradlew assembleRelease` sat here for over three hours on
    # 6 September and had reached neither Maestro nor a flow; a cold build of
    # this app is 10-25 minutes, so anything past 50 is stuck rather than slow.
    timeout-minutes: 50
    # Skipped for Dependabot and for forks, whose PRs GitHub deliberately
    # denies secrets. Without this the job cannot write the Firebase
    # credentials, fails on the secret guard within seconds, and leaves a red
    # check on every dependency bump — which is how a team learns to ignore
    # red checks. ci.yml already skips its SonarCloud step for the same reason.
    steps:
      - uses: actions/checkout@v4

      # Everything from the toolchain to an installable release APK. Shared
      # with `videos.yml`, which needed the same hundred lines — see the
      # action's own header for why every comment in it is there.
      - uses: ./.github/actions/build-android-app
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ⚠️ `continue-on-error`, so a flow that fails on its last step still
      # hands over what it captured. The first run failed on the seventh
      # screenshot and discarded the six before it; the collect step below is
      # what decides whether the job passed, because images are the point.
      - name: Run flows on an emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The driver install is the slow part even with KVM; the default is
          # not generous enough on a shared runner.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # ⚠️ A REAL phone profile, and the reason this line exists: without
          # it the emulator is 320x640, and the first full set of Android
          # store screenshots was captured at exactly that — 320px is Play's
          # absolute MINIMUM for the short side, so they were accepted and
          # looked it. Play recommends 1080x1920 or better; pixel_6 is
          # 1080x2400, which also matches the tall aspect of the iOS set.
          profile: pixel_6
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/screenshots.yaml

      # ⚠️ `if: always()`, not `if: failure()`. In the E2E workflow the Maestro
      # output is evidence for a failure; here the images ARE the job, and a
      # run that succeeded and kept nothing would have been pointless.
      #
      # `takeScreenshot` writes to the working directory, so they land in the
      # repository root named exactly as the flow named them.
      - name: Collect the screenshots
        if: always()
        run: |
          mkdir -p screenshots
          # ⚠️ `~/.maestro/tests/`, not the working directory. `takeScreenshot`
          # writes into Maestro's own debug directory for the run, which the
          # first attempt did not know — it looked in the repository root,
          # found nothing, and threw away six perfectly good screenshots while
          # reporting that none had been produced.
          find "$HOME/.maestro/tests" -name '[0-9][0-9]-*.png' -exec cp {} screenshots/ \;
          ls -la screenshots/
          test -n "$(ls -A screenshots/)" || {
            echo "::error::The flow produced no screenshots."; exit 1;
          }

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-android
          path: screenshots/
          retention-days: 30

  ios:
    name: Capture screenshots — iOS
    runs-on: macos-latest
    # Prebuild, CocoaPods, xcodebuild, then nine flows. The run that passed
    # eight of nine took about 25 minutes end to end.
    timeout-minutes: 50
    # Skipped for Dependabot and for forks, whose PRs GitHub deliberately
    # denies secrets. Without this the job cannot write the Firebase
    # credentials, fails on the secret guard within seconds, and leaves a red
    # check on every dependency bump — which is how a team learns to ignore
    # red checks. ci.yml already skips its SonarCloud step for the same reason.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not optional on iOS: @react-native-firebase/crashlytics autolinks a
      # build phase that reads GOOGLE_APP_ID out of this file, so the app fails
      # to build without it whether or not the Expo config plugins run.
      - name: Write Firebase credentials
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST is not set. Add it with: base64 -i GoogleService-Info.plist | pbcopy"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist
          plutil -lint GoogleService-Info.plist > /dev/null \
            || { echo "::error::GOOGLE_SERVICE_INFO_PLIST did not decode to a valid plist."; exit 1; }

      # No --no-install here: the .xcworkspace only exists once CocoaPods has
      # run, and xcodebuild needs the workspace rather than the bare project.
      - name: Prebuild iOS
        run: |
          pnpm expo prebuild --platform ios
          # `expo prebuild` reports "Command `pod install` failed" and still
          # exits 0. Without this check the job carried on to xcodebuild, which
          # failed with "'' is not a workspace file" — an opaque error 500 lines
          # below the one that mattered. Fail where the fault actually is.
          if ! ls -d ios/*.xcworkspace >/dev/null 2>&1; then
            echo "::error::pod install produced no ios/*.xcworkspace. The real failure is in the prebuild output above."
            exit 1
          fi

      - name: Build for the simulator
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Building scheme $scheme from $workspace"
          echo "IOS_SCHEME=$scheme" >> "$GITHUB_ENV"
          xcodebuild -workspace "$workspace" \
            -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Pick whatever iPhone this runner image actually ships. Hardcoding a
      # model name breaks silently every time GitHub rolls the image forward —
      # "iPhone 16" was not present and simctl failed with "Invalid device".
      # ⚠️ A SPECIFIC device, not the first iPhone the runner offers.
      # App Store Connect takes 1290x2796 for the 6.7" slot, which is what a
      # Pro Max produces. The E2E job grabs whatever comes first because it
      # only cares that the app works; here the pixel dimensions ARE the
      # deliverable, and a screenshot off a plain iPhone is rejected at upload.
      # ⚠️ TWO sets, because `supportsTablet` is true. App Store Connect
      # requires a 13-inch iPad set alongside the 6.9-inch iPhone one, and the
      # iPad set is not optional while the app declares tablet support — which
      # it means: there is a NavRail instead of a tab bar, and three
      # `.tablet.test.tsx` files behind it.
      #
      # The flow itself needs no changes. `NavRail` carries the same
      # `tab-<name>` testIDs as `TabBar`, and `open-settings` too, so
      # screenshots.yaml drives either layout without knowing which it is on.
      - name: Capture on a 6.9-inch iPhone
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 360000
          APP: ios/build/Build/Products/Release-iphonesimulator/${{ env.IOS_SCHEME }}.app
        run: |
          tools/capture-ios-screenshots.sh screenshots-ios \
            "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 15 Pro Max"

      # 2064x2752 on the M4, 2048x2732 on the 12.9-inch — App Store Connect
      # accepts either for the 13-inch slot.
      - name: Capture on a 13-inch iPad
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 360000
          APP: ios/build/Build/Products/Release-iphonesimulator/${{ env.IOS_SCHEME }}.app
        run: |
          tools/capture-ios-screenshots.sh screenshots-ipad \
            "iPad Pro 13-inch" "iPad Air 13-inch" "iPad Pro (12.9-inch)"

      # ⚠️ `if: always()`, not `if: failure()`. The images ARE the job, and
      # `continue-on-error` above means a flow that fell over on its last step
      # still leaves everything before it worth keeping.
      - name: Check something was captured
        if: always()
        run: |
          for dir in screenshots-ios screenshots-ipad; do
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "$dir: $(ls "$dir" | wc -l | tr -d ' ') images"
            else
              echo "::warning::$dir is empty."
            fi
          done
          test -n "$(ls -A screenshots-ios 2>/dev/null)" \
            || { echo "::error::The iPhone capture produced nothing."; exit 1; }

          # ⚠️ While `supportsTablet` is true, App Store Connect REQUIRES the
          # iPad set — so an empty one has to fail the job, not warn.
          #
          # The first run of this captured no iPad at all (it asked for an M4
          # on a runner that had an M5) and reported SUCCESS, because the check
          # above only looked at the iPhone. That is the same shape as the
          # Android screenshots sitting at 320x640 for a week: a green tick
          # over a missing or wrong asset, found at upload.
          if node -e "process.exit(require('./app.json').expo.ios.supportsTablet ? 0 : 1)"; then
            test -n "$(ls -A screenshots-ipad 2>/dev/null)" || {
              echo "::error::app.json declares supportsTablet, so Apple requires an iPad set — and none was captured."
              exit 1
            }
          fi

      - name: Upload the iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-ios
          path: screenshots-ios/
          retention-days: 30

      - name: Upload the iPad screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-ipad
          path: screenshots-ipad/
          retention-days: 30
