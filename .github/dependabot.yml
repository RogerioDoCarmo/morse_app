version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Feature branches merge into develop, and so should dependency bumps.
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The Expo SDK curates these as a set — they must move together via
      # `expo install`, never one at a time by a bot.
      #
      # ⚠️ The authority is `expo/bundledNativeModules.json` in the installed
      # SDK, NOT the naming convention. This list was written from the
      # convention and so had a hole in it for months: async-storage is
      # curated, is pinned by SDK 57 to an exact `2.2.0`, and matches none of
      # the `expo-*` / `react-native-*` / `@react-native/*` patterns. #140
      # came through that hole proposing 2.2.0 -> 3.1.1, a native-module major
      # that would have broken the SDK 57 pinning. `react-server-dom-webpack`
      # is the same shape and had not been proposed yet.
      #
      # When bumping the SDK, diff this list against that file rather than
      # trusting the prefixes.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: react-test-renderer
      - dependency-name: react-server-dom-webpack
      - dependency-name: jest-expo
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-async-storage/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci
