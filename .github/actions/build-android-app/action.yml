name: Build the Android app for a device run
description: >-
  Everything between a checkout and an installable release APK: the toolchain,
  the Gradle cache, KVM, the Firebase credentials, the prebuild, the memory a
  bare runner does not have, and the build itself.

# ⚠️ This exists because `screenshots.yml` said, in its own header, that
# "solving it twice is how the two drift" — and then `videos.yml` needed the
# same hundred lines. Every comment below was earned by a failure; they are
# kept here rather than summarised, because the next person to hit one of them
# will be reading this file at the point it breaks.

inputs:
  google-services-json:
    description: Base64 of google-services.json, from the repository secret.
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # NOT setup-java's `cache: gradle`. That builds its key by hashing gradle
    # files, and there are none at checkout — `android/` is gitignored and does
    # not exist until `expo prebuild` runs below. The action fails outright
    # rather than skipping.
    #
    # Keyed on the files that DO exist and that actually decide what gets
    # compiled: the lockfile and the app config. Without a cache every run
    # recompiles every native module from scratch — Firebase, camera, audio,
    # speech recognition, SVG, reanimated.
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'app.json', 'app.config.js') }}
        restore-keys: gradle-${{ runner.os }}-

    # Without KVM the emulator is software-rendered and glacial: boot took
    # 10.7 minutes on the first run here, and Maestro's driver then timed out
    # before it could attach. This is the fix, not a longer timeout.
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - shell: bash
      run: pnpm install --frozen-lockfile

    # The Firebase config plugins only apply when this file is present, so
    # without it CI would build a different app from the one that ships —
    # exactly the divergence that hid three iOS build failures. Injected from
    # a secret rather than committed, since the repo is public.
    #
    # ⚠️ Passed in as an INPUT. A composite action cannot read `secrets`, so
    # the caller has to hand it over; forgetting to is the one way to use this
    # action wrongly, and the guard below is what says so.
    - name: Write Firebase credentials
      shell: bash
      env:
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "::error::Secret GOOGLE_SERVICES_JSON is not set. Add it with: base64 -i google-services.json | pbcopy"
          exit 1
        fi
        printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json
        jq -e '.project_info.project_id' google-services.json > /dev/null \
          || { echo "::error::GOOGLE_SERVICES_JSON did not decode to a valid google-services.json."; exit 1; }

    - name: Prebuild Android
      shell: bash
      run: pnpm expo prebuild --platform android --no-install

    # `expo-updates`' KSP step dies with OutOfMemoryError: Metaspace on a
    # shared runner, and Gradle then grinds on for the rest of the job without
    # ever producing an APK.
    #
    # METASPACE only. Raising the heap as well — 4g for Gradle, 2g for the
    # Kotlin daemon — moved the failure rather than removing it: Expo's
    # autolinking plugin shells out to node during configuration, and with
    # that much reserved it exited 1 before the build reached a single task.
    # The template's heap was never the problem; its 512m metaspace was.
    #
    # Written here rather than committed, because `android/` is gitignored and
    # regenerated by prebuild on every run — and because this is a CI
    # constraint. EAS builders have the memory already.
    - name: Give Gradle and Kotlin room to compile
      shell: bash
      run: |
        # The leading newline is load-bearing. prebuild writes this file
        # WITHOUT a trailing one, so appending directly ran the first property
        # onto the end of the last existing line and produced
        # `expo.inlineModules.watchedDirectories=[]org.gradle.jvmargs=...`.
        # That silently corrupted an autolinking property, and Expo's
        # autolinking plugin then exited 1 during configuration.
        printf '\n%s\n%s\n' \
          "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m" \
          "kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1024m" \
          >> android/gradle.properties
        echo "--- last four lines, each must start a line of its own ---"
        tail -4 android/gradle.properties

    # Release, not debug: a debug APK fetches its JS bundle from the Metro dev
    # server, which is not running in CI, so the app launches to an error
    # screen and every flow fails on "screen is visible". A release build
    # embeds the bundle. Expo's generated release buildType signs with the
    # debug keystore, so this needs no secrets.
    #
    # One ABI, not four. React Native compiles its native modules once per
    # architecture, and with no `reactNativeArchitectures` set the default is
    # armeabi-v7a, arm64-v8a, x86 AND x86_64 — roughly four times the work.
    # The emulator is x86_64 only, so the other three are compiled and thrown
    # away. Scoped to CI on purpose: gradle.properties is left alone so a real
    # device build, and anything EAS produces, still covers every ABI.
    #
    # --stacktrace because the failure this replaced reported only "Process
    # 'command 'node'' finished with non-zero exit value 1" with no task name
    # and none of node's own output — Expo's gradle scripts shell out to node
    # during CONFIGURATION, so there is no task to name and nothing to go on
    # without it.
    - name: Build release APK
      shell: bash
      working-directory: android
      run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --stacktrace

    - name: Install Maestro
      shell: bash
      run: |
        curl -fsSL https://get.maestro.mobile.dev | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
