sonar.projectKey=RogerioDoCarmo_morse_app
sonar.organization=rogeriodocarmo
sonar.projectName=OmniMorse
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/reports/**,**/.stryker-tmp/**,android/**,ios/**,design/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mirrors jest.config.js `collectCoverageFrom` negations, so the metric reflects
# real runtime code. Keep the two in step — a file excluded from Jest coverage
# but not from Sonar shows up as a permanent 0%.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.stories.tsx,**/index.ts,src/types/**,src/testing/**,src/core/ports/**,src/i18n/keys.ts

# S7503 (async method with no `await`) is off for the same files eslint turns
# `require-await` off for. An adapter or fake satisfies an ASYNC port contract
# whether or not its own body awaits anything, and `async` is what turns a
# throw into the rejected promise the caller handles. Rewriting each one as a
# plain function returning Promise.resolve() would lose that for nothing.
sonar.issue.ignore.multicriteria=asyncPortAdapters,asyncPortFakes
sonar.issue.ignore.multicriteria.asyncPortAdapters.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.asyncPortAdapters.resourceKey=src/adapters/**
sonar.issue.ignore.multicriteria.asyncPortFakes.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.asyncPortFakes.resourceKey=src/testing/**
