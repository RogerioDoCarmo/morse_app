sonar.projectKey=RogerioDoCarmo_morse_app
sonar.organization=rogeriodocarmo
sonar.projectName=Morse
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/reports/**,**/.stryker-tmp/**,android/**,ios/**,design/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mirrors jest.config.js `collectCoverageFrom` negations, so the metric reflects
# real runtime code. Keep the two in step — a file excluded from Jest coverage
# but not from Sonar shows up as a permanent 0%.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.stories.tsx,**/index.ts,src/types/**,src/testing/**,src/core/ports/**,src/i18n/keys.ts
